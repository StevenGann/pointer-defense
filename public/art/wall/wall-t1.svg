<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tier-1 wall face. A white template: the engine tints it to the live button grey, so every mark
     here is engraved in pale grey. The cheapest wall: one sheet, one seam, two tacks. -->
  <rect x="2" y="2" width="28" height="28" fill="#ffffff"/>
  <rect x="9" y="19" width="14" height="1" fill="#d2d2d2"/>
  <rect x="9" y="20" width="14" height="1" fill="#ececec"/>
  <rect x="9" y="10" width="2" height="2" fill="#b4b4b4"/><rect x="9" y="10" width="1" height="1" fill="#ffffff"/><rect x="21" y="10" width="2" height="2" fill="#b4b4b4"/><rect x="21" y="10" width="1" height="1" fill="#ffffff"/>
</svg>
