  <path transform="translate(1 1)" stroke="#ffffff" stroke-width="1.2" d="M-32 0 L0 32 M-32 32 L0 0 M-24 0 L8 32 M-24 32 L8 0 M-16 0 L16 32 M-16 32 L16 0 M-8 0 L24 32 M-8 32 L24 0 M0 0 L32 32 M0 32 L32 0 M8 0 L40 32 M8 32 L40 0 M16 0 L48 32 M16 32 L48 0 M24 0 L56 32 M24 32 L56 0 M32 0 L64 32 M32 32 L64 0 M40 0 L72 32 M40 32 L72 0 M48 0 L80 32 M48 32 L80 0 M56 0 L88 32 M56 32 L88 0 M64 0 L96 32 M64 32 L96 0"/>
  <path stroke="#707070" stroke-width="1.2" d="M-32 0 L0 32 M-32 32 L0 0 M-24 0 L8 32 M-24 32 L8 0 M-16 0 L16 32 M-16 32 L16 0 M-8 0 L24 32 M-8 32 L24 0 M0 0 L32 32 M0 32 L32 0 M8 0 L40 32 M8 32 L40 0 M16 0 L48 32 M16 32 L48 0 M24 0 L56 32 M24 32 L56 0 M32 0 L64 32 M32 32 L64 0 M40 0 L72 32 M40 32 L72 0 M48 0 L80 32 M48 32 L80 0 M56 0 L88 32 M56 32 L88 0 M64 0 L96 32 M64 32 L96 0"/>
  </g>
