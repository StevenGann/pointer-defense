<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs><clipPath id="face"><rect x="3" y="3" width="26" height="26"/></clipPath></defs>
  <g clip-path="url(#face)">
    <!-- Damage stage 1 (light): one stepped crack in from the left edge, and one loose pixel.
         Cracks run in right angles on a grid, like a broken bitmap. A white copy one unit down and
         right makes each crack read as cut into the button face. -->
    <g transform="translate(1 1)" opacity="0.6">
      <path d="M3 7.5 H8.5 V11.5 H12.5 V15.5 H16.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>
      <g fill="#ffffff"><rect x="9" y="13" width="2" height="2"/></g>
    </g>
    <path d="M3 7.5 H8.5 V11.5 H12.5 V15.5 H16.5" fill="none" stroke="#404040" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter"/>
    <g fill="#404040"><rect x="9" y="13" width="2" height="2"/></g>
  </g>
</svg>
