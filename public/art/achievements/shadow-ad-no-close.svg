<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Customer Service: let ten ads expire, then lose. Pop-ups thrown in a bin. Third of the pop-up icons. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(15 12) scale(0.75) rotate(-18)"><rect x="-12" y="-9" width="24" height="18" fill="#c0c0c0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-10.5" y="-7.5" width="21" height="4" fill="#000080"/></g>
    <g transform="translate(28 11) scale(0.75) rotate(14)"><rect x="-12" y="-9" width="24" height="18" fill="#c0c0c0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-10.5" y="-7.5" width="21" height="4" fill="#808080"/></g>
    <polygon points="7,18 37,18 33,41 11,41" fill="#808080" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 22 L16.5 37 M22 22 V37 M29 22 L27.5 37" stroke="#000000" stroke-width="1.4"/><rect x="5" y="15.5" width="34" height="4" fill="#c0c0c0" stroke="#000000" stroke-width="1.2"/>
  </g>
</svg>
