<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Where Did It Go: drag the Help window off screen and back. A window half past the screen edge. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <clipPath id="e"><rect x="0" y="0" width="29" height="44"/></clipPath><g clip-path="url(#e)"><g transform="translate(27 22) scale(1) rotate(0)"><rect x="-15" y="-12" width="30" height="24" fill="#c0c0c0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13.5" y="-10.5" width="27" height="4" fill="#000080"/></g><path d="M15 21 H27 M15 26 H27" stroke="#808080" stroke-width="1.6"/></g><path d="M29 2 V42" stroke="#000000" stroke-width="2.4"/><path d="M33 8 L39 14 M33 20 L39 26 M33 32 L39 38" stroke="#808080" stroke-width="1.6"/><polygon points="10,22 3,17.5 3,26.5" fill="#000000"/>
  </g>
</svg>
