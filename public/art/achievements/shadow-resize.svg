    <path d="M27 27 L39 39" stroke="#000000" stroke-width="4.6" stroke-linecap="round"/><polygon points="24,24 32,25.5 25.5,32" fill="#000000"/><polygon points="41,41 33,39.5 39.5,33" fill="#000000"/><path d="M28 28 L38 38" stroke="#ffffff" stroke-width="1.6"/>
  </g>
