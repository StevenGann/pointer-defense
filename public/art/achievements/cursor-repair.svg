<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Maintenance Window: repair 5 towers with one Cursor. The cursor and wrench, with a green 5. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(27 27) scale(1.05) rotate(0)"><path d="M-8 9 L1.5 -0.5 M7 -10 A5 5 0 1 0 10 -3.5" fill="none" stroke="#000000" stroke-width="5.6" stroke-linecap="round"/><path d="M-8 9 L1.5 -0.5 M7 -10 A5 5 0 1 0 10 -3.5" fill="none" stroke="#dfdfdf" stroke-width="2.8" stroke-linecap="round"/></g>
    <g transform="translate(8 6) scale(1.3) rotate(0)"><polygon points="0,0 0,17 4,13.4 6.8,19.6 9.4,18.4 6.7,12.4 12,12.4" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g fill="#000000"><rect x="30.55" y="3.95" width="3.70" height="3.70"/><rect x="33.15" y="3.95" width="3.70" height="3.70"/><rect x="35.75" y="3.95" width="3.70" height="3.70"/><rect x="30.55" y="6.55" width="3.70" height="3.70"/><rect x="30.55" y="9.15" width="3.70" height="3.70"/><rect x="33.15" y="9.15" width="3.70" height="3.70"/><rect x="35.75" y="9.15" width="3.70" height="3.70"/><rect x="35.75" y="11.75" width="3.70" height="3.70"/><rect x="30.55" y="14.35" width="3.70" height="3.70"/><rect x="33.15" y="14.35" width="3.70" height="3.70"/><rect x="35.75" y="14.35" width="3.70" height="3.70"/></g><g fill="#00ff00"><rect x="31.10" y="4.50" width="2.95" height="2.95"/><rect x="33.70" y="4.50" width="2.95" height="2.95"/><rect x="36.30" y="4.50" width="2.95" height="2.95"/><rect x="31.10" y="7.10" width="2.95" height="2.95"/><rect x="31.10" y="9.70" width="2.95" height="2.95"/><rect x="33.70" y="9.70" width="2.95" height="2.95"/><rect x="36.30" y="9.70" width="2.95" height="2.95"/><rect x="36.30" y="12.30" width="2.95" height="2.95"/><rect x="31.10" y="14.90" width="2.95" height="2.95"/><rect x="33.70" y="14.90" width="2.95" height="2.95"/><rect x="36.30" y="14.90" width="2.95" height="2.95"/></g>
