  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(19 15) scale(1.45) rotate(0)"><polygon points="-9,5 -9,-4 -4.5,0.5 0,-6 4.5,0.5 9,-4 9,5" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="-8,4.5 -8,-1.8 -4.5,1.8 -1.2,-3 -1.2,4.5" fill="#ffffff" opacity="0.45"/><polygon points="9,5 9,-4 6,-1 6,5" fill="#000000" opacity="0.18"/><rect x="-9" y="4.5" width="18" height="3.5" fill="#a87800" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-8 5.5 H8" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.8" opacity="0.5"/><g fill="#ffcc00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"><circle cx="-9" cy="-4.4" r="1.5"/><circle cx="0" cy="-6.4" r="1.5"/><circle cx="9" cy="-4.4" r="1.5"/></g><circle cx="0" cy="1" r="1.6" fill="#ff0000" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-0.5" cy="0.5" r="0.5" fill="#ffffff"/><circle cx="-5.2" cy="6.2" r="0.8" fill="#00ffff"/><circle cx="5.2" cy="6.2" r="0.8" fill="#00ffff"/></g>
