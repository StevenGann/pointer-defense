<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- First Blood: first kill of any run. A cracked enemy shell under a red crosshair. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 22) scale(1.15) rotate(0)"><circle r="10" fill="#35506a" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-7.5 -3 A8 8 0 0 1 -3 -7.5" fill="none" stroke="#6f93ad" stroke-width="1.4" stroke-linecap="round"/><circle r="4.4" fill="#0e1a24"/><circle r="3.2" fill="#bfe6ff"/><circle r="1.5" fill="#000000"/></g>
    <g transform="translate(22 22) scale(1) rotate(0)"><path d="M-9 -9 H-3 V-2 H3 V5 H9" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="miter"/></g>
    <g fill="none" stroke="#ff0000" stroke-width="2"><circle cx="22" cy="22" r="15.5"/><path d="M22 3 V11 M22 33 V41 M3 22 H11 M33 22 H41"/></g>
  </g>
</svg>
