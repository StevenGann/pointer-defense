<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- High Contrast: finish a run with screen shake off. A black-and-white monitor. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 21) scale(1.5) rotate(0)"><rect x="-12" y="-11" width="24" height="18" fill="#c0c0c0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9.5" y="-8.5" width="19" height="13" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="-3" y="7" width="6" height="3" fill="#808080" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="-7.5" y="10" width="15" height="2.6" fill="#c0c0c0" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <polygon points="7.75,8.25 36.25,8.25 7.75,27.75" fill="#000000"/><circle cx="16" cy="15" r="3" fill="#ffffff"/><circle cx="28" cy="21" r="3" fill="#000000"/>
  </g>
</svg>
