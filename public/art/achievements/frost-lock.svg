<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Deep Freeze: keep 12 enemies slowed at once. A snowflake with a padlock. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(19 19) scale(1.35) rotate(0)"><g fill="none" stroke-linecap="round"><path d="M0 -11 V11 M-9.5 -5.5 L9.5 5.5 M-9.5 5.5 L9.5 -5.5" stroke="#0c4466" stroke-width="4.2"/><path d="M0 -11 V11 M-9.5 -5.5 L9.5 5.5 M-9.5 5.5 L9.5 -5.5" stroke="#9fe8ff" stroke-width="2"/></g><circle r="2.6" fill="#ffffff" stroke="#0c4466" stroke-width="1"/></g>
    <g transform="translate(32 31) scale(1.05) rotate(0)"><path d="M-4 0 V-4 A4 4 0 0 1 4 -4 V0" fill="none" stroke="#000000" stroke-width="4"/><path d="M-4 0 V-4 A4 4 0 0 1 4 -4 V0" fill="none" stroke="#dfdfdf" stroke-width="1.8"/><rect x="-6.5" y="-1" width="13" height="10" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-1" y="2" width="2" height="4" fill="#000000"/></g>
  </g>
</svg>
