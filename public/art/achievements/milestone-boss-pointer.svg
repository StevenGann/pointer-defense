<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Milestone Hunter: kill a milestone boss with the pointer. The crown on a red seal, under the cursor. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(0) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(30) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(60) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(90) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(120) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(150) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(180) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(210) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(240) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(270) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(300) translate(-3 0)"/><polygon points="20,3 3,-3 3,3" fill="#ff0000" stroke="#000000" stroke-width="1" transform="translate(19 19) rotate(330) translate(-3 0)"/>
    <circle cx="19" cy="19" r="14" fill="#ff0000" stroke="#000000" stroke-width="1.5"/><circle cx="19" cy="19" r="11" fill="none" stroke="#800000" stroke-width="1"/>
    <g transform="translate(19 19) scale(0.95) rotate(0)"><polygon points="-9,5 -9,-4 -4.5,0.5 0,-6 4.5,0.5 9,-4 9,5" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9" y="4.5" width="18" height="3.5" fill="#a87800" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="0.5" r="1.4" fill="#ff0000" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(25 22) scale(1.05) rotate(0)"><polygon points="0,0 0,17 4,13.4 6.8,19.6 9.4,18.4 6.7,12.4 12,12.4" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
