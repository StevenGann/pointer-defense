<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Beveled Win95 tile in the grey palette. -->
  <rect x="0.5" y="0.5" width="43" height="43" fill="#c0c0c0"/>
  <rect x="0" y="0" width="44" height="1" fill="#ffffff"/>
  <rect x="0" y="0" width="1" height="44" fill="#ffffff"/>
  <rect x="0" y="1" width="44" height="1" fill="#dfdfdf"/>
  <rect x="1" y="0" width="1" height="44" fill="#dfdfdf"/>
  <rect x="0" y="43" width="44" height="1" fill="#000000"/>
  <rect x="43" y="0" width="1" height="44" fill="#000000"/>
  <rect x="0" y="42" width="44" height="1" fill="#808080"/>
  <rect x="42" y="0" width="1" height="44" fill="#808080"/>
  <!-- Question-block glyph: a sunken panel with a question mark. -->
  <rect x="13" y="13" width="18" height="18" fill="#c0c0c0"/>
  <rect x="13" y="13" width="18" height="18" fill="none" stroke="#808080" stroke-width="1"/>
  <text x="22" y="27" font-family="Tahoma, Verdana, Geneva, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">?</text>
</svg>
