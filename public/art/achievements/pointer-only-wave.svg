<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Bare Hands: clear a wave without building a tower. A cursor alone on an empty grid. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 22) scale(1.25) rotate(0)"><rect x="-13" y="-13" width="26" height="26" fill="#dfdfdf" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M-4.3 -13 V13 M4.3 -13 V13 M-13 -4.3 H13 M-13 4.3 H13" fill="none" stroke="#808080" stroke-width="1"/><path d="M-12 12 V-12 H12" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9"/><path d="M12 -12 V12 H-12" fill="none" stroke="#808080" stroke-width="0.9"/></g>
    <g transform="translate(17 14) scale(1.15) rotate(0)"><polygon points="0,0 0,17 4,13.4 6.8,19.6 9.4,18.4 6.7,12.4 12,12.4" fill="#000000" opacity="0.3" transform="translate(1.6 1.6)"/><polygon points="0,0 0,17 4,13.4 6.8,19.6 9.4,18.4 6.7,12.4 12,12.4" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
