<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Fast Forward: play a wave at 3x speed. Three arrows in a chrome housing. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="3" y="11" width="38" height="22" fill="#c0c0c0" stroke="#000000" stroke-width="1.5"/><path d="M4.5 31.5 V12.5 H39.5" fill="none" stroke="#ffffff" stroke-width="1.4"/><path d="M39.5 12.5 V31.5 H4.5" fill="none" stroke="#808080" stroke-width="1.4"/>
    <g transform="translate(11 22) scale(1.1) rotate(0)"><polygon points="-4,-6 6,0 -4,6" fill="#000080" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(21.5 22) scale(1.1) rotate(0)"><polygon points="-4,-6 6,0 -4,6" fill="#000080" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(32 22) scale(1.1) rotate(0)"><polygon points="-4,-6 6,0 -4,6" fill="#000080" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
