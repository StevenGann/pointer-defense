<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Splash Zone: kill 6 enemies with one shell. A blast ring with six pieces of debris. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <circle cx="22" cy="22" r="11" fill="none" stroke="#000000" stroke-width="6"/><circle cx="22" cy="22" r="11" fill="none" stroke="#ff7a1a" stroke-width="3.4"/><circle cx="22" cy="22" r="5" fill="#ffff00" stroke="#000000" stroke-width="1.2"/>
    <rect x="19.5" y="1.5" width="5" height="5" fill="#35506a" stroke="#000000" stroke-width="1.2" transform="rotate(0 22 22)"/><rect x="19.5" y="1.5" width="5" height="5" fill="#35506a" stroke="#000000" stroke-width="1.2" transform="rotate(60 22 22)"/><rect x="19.5" y="1.5" width="5" height="5" fill="#35506a" stroke="#000000" stroke-width="1.2" transform="rotate(120 22 22)"/><rect x="19.5" y="1.5" width="5" height="5" fill="#35506a" stroke="#000000" stroke-width="1.2" transform="rotate(180 22 22)"/><rect x="19.5" y="1.5" width="5" height="5" fill="#35506a" stroke="#000000" stroke-width="1.2" transform="rotate(240 22 22)"/><rect x="19.5" y="1.5" width="5" height="5" fill="#35506a" stroke="#000000" stroke-width="1.2" transform="rotate(300 22 22)"/>
  </g>
</svg>
