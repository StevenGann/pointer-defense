  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(12 20) scale(0.6) rotate(0)"><g stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-4 -7 V-10 M0 -7 V-10 M4 -7 V-10 M-4 7 V10 M0 7 V10 M4 7 V10 M-7 -4 H-10 M-7 0 H-10 M-7 4 H-10 M7 -4 H10 M7 0 H10 M7 4 H10" fill="none"/></g><rect x="-7" y="-7" width="14" height="14" fill="#008080" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-3.5" y="-3.5" width="7" height="7" fill="#00ffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(32 20) scale(0.6) rotate(0)"><g stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-4 -7 V-10 M0 -7 V-10 M4 -7 V-10 M-4 7 V10 M0 7 V10 M4 7 V10 M-7 -4 H-10 M-7 0 H-10 M-7 4 H-10 M7 -4 H10 M7 0 H10 M7 4 H10" fill="none"/></g><rect x="-7" y="-7" width="14" height="14" fill="#008080" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-3.5" y="-3.5" width="7" height="7" fill="#00ffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
