<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Beam Me Up: kill 5 enemies with one Laser beam. A beam through five rings. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <path d="M2 22 H42" stroke="#000000" stroke-width="5"/><path d="M2 22 H42" stroke="#ff3300" stroke-width="2.6"/><path d="M2 22 H42" stroke="#fff4c8" stroke-width="0.9"/>
    <ellipse cx="6" cy="22" rx="3" ry="9" fill="none" stroke="#000000" stroke-width="3"/><ellipse cx="6" cy="22" rx="3" ry="9" fill="none" stroke="#6f93ad" stroke-width="1.4"/><ellipse cx="14" cy="22" rx="3" ry="9" fill="none" stroke="#000000" stroke-width="3"/><ellipse cx="14" cy="22" rx="3" ry="9" fill="none" stroke="#6f93ad" stroke-width="1.4"/><ellipse cx="22" cy="22" rx="3" ry="9" fill="none" stroke="#000000" stroke-width="3"/><ellipse cx="22" cy="22" rx="3" ry="9" fill="none" stroke="#6f93ad" stroke-width="1.4"/><ellipse cx="30" cy="22" rx="3" ry="9" fill="none" stroke="#000000" stroke-width="3"/><ellipse cx="30" cy="22" rx="3" ry="9" fill="none" stroke="#6f93ad" stroke-width="1.4"/><ellipse cx="38" cy="22" rx="3" ry="9" fill="none" stroke="#000000" stroke-width="3"/><ellipse cx="38" cy="22" rx="3" ry="9" fill="none" stroke="#6f93ad" stroke-width="1.4"/>
  </g>
</svg>
