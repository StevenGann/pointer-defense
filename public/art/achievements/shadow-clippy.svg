<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- It Looks Like You're Writing a Game: open every Help page without playing a wave. A paperclip over the manual. First of two paperclip icons. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(18 24) scale(1.35) rotate(0)"><rect x="6.6" y="-9.6" width="3.2" height="19.6" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M7.6 -8 V9 M8.8 -8 V9" stroke="#808080" stroke-width="0.6"/><rect x="-9" y="-11" width="16" height="22" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9" y="-11" width="3.4" height="22" fill="#a87800" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M-8.2 -7 H-6.4 M-8.2 7 H-6.4" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" opacity="0.7"/><path d="M-4.6 9.6 V-9.6 H5.8" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9" opacity="0.55"/><rect x="-3.4" y="-7" width="8.4" height="5" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M-2 3 H3.6 M-2 6 H1.6" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1" opacity="0.4"/></g>
