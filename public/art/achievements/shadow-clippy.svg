<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- It Looks Like You're Writing a Game: open every Help page without playing a wave. A paperclip over the manual. First of two paperclip icons. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(18 24) scale(1.35) rotate(0)"><rect x="-9" y="-11" width="18" height="22" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9" y="-11" width="3.4" height="22" fill="#a87800" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="-3.4" y="-7" width="9.6" height="5" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(31 14) scale(1.3) rotate(14)"><path d="M-3 6 V-6 A4 4 0 0 1 5 -6 V7 A6 6 0 0 1 -7 7 V-5" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/><path d="M-3 6 V-6 A4 4 0 0 1 5 -6 V7 A6 6 0 0 1 -7 7 V-5" fill="none" stroke="#dfdfdf" stroke-width="1.8" stroke-linecap="round"/></g>
    <circle cx="29.5" cy="9" r="1.4" fill="#000000"/><circle cx="34.5" cy="10" r="1.4" fill="#000000"/>
  </g>
</svg>
