<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Chain Reaction: tase 4 enemies with one shot. A bolt that forks four ways. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M22 41 L19 32 L25 28 L22 21 M22 21 L8 15 L10 9 L4 5 M22 21 L16 12 L19 8 L15 3 M22 21 L27 12 L24 8 L29 3 M22 21 L35 16 L34 10 L40 6" stroke="#000000" stroke-width="4.6"/><path d="M22 41 L19 32 L25 28 L22 21 M22 21 L8 15 L10 9 L4 5 M22 21 L16 12 L19 8 L15 3 M22 21 L27 12 L24 8 L29 3 M22 21 L35 16 L34 10 L40 6" stroke="#ffff00" stroke-width="2.2"/></g><circle cx="22" cy="21" r="2.6" fill="#ffffff" stroke="#000000"/>
  </g>
</svg>
