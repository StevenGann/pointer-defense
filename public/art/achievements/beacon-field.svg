<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Beacon Field: ten beacons at once. One lit beacon in a ring of nine. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 22) scale(0.9) rotate(0)"><circle r="9" fill="none" stroke="#000000" stroke-width="5"/><circle r="9" fill="none" stroke="#ffcc00" stroke-width="2.8"/><path d="M-8.2 -3.6 A9 9 0 0 1 -3.6 -8.2" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" opacity="0.9"/><path d="M8.2 3.6 A9 9 0 0 1 3.6 8.2" fill="none" stroke="#a87800" stroke-width="1.2" stroke-linecap="round"/><circle r="6" fill="#ffff00" opacity="0.35"/><circle r="4" fill="#ffff00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-1.2" cy="-1.2" r="1.2" fill="#ffffff"/></g>
    <circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(0 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(40 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(80 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(120 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(160 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(200 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(240 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(280 22 22)"/><circle cx="22" cy="4.6" r="3" fill="#ffcc00" stroke="#000000" stroke-width="1.2" transform="rotate(320 22 22)"/>
  </g>
</svg>
