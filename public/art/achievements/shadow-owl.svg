<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Night Shift: clear a wave between 2 and 4 am. An owl under a moon. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <path d="M36 3 A8 8 0 1 0 41 14 A6.5 6.5 0 0 1 36 3 Z" fill="#ffff00" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 16 L10 9 L15 13 H23 L28 9 L30 16 V30 A11 11 0 0 1 8 30 Z" fill="#7a4a14" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="19" cy="31" rx="6.5" ry="7.5" fill="#c0803c"/><circle cx="14" cy="20" r="4.6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><circle cx="24" cy="20" r="4.6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><circle cx="14" cy="20" r="2" fill="#000000"/><circle cx="24" cy="20" r="2" fill="#000000"/><polygon points="17,24 21,24 19,28" fill="#ffcc00" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
