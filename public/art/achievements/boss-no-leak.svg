<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Boss Proof: kill a milestone boss without losing integrity. The crown behind a gold shield. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 12) scale(1.5) rotate(0)"><polygon points="-9,5 -9,-4 -4.5,0.5 0,-6 4.5,0.5 9,-4 9,5" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9" y="4.5" width="18" height="3.5" fill="#a87800" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="0.5" r="1.4" fill="#ff0000" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(22 27) scale(1.05) rotate(0)"><path d="M0 -12 L10 -9 V0 Q10 8.5 0 13 Q-10 8.5 -10 0 V-9 Z" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M0 -10.2 L-8.3 -7.7 V0 Q-8.3 7.2 0 11.2 Z" fill="#fff2a0"/></g>
  </g>
</svg>
