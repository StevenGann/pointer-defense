<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Cheated Cookies Taste Awful: use the cheat menu at all. A cookie with a keyhole. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <circle cx="22" cy="22" r="17" fill="#c0803c" stroke="#000000" stroke-width="1.5"/><path d="M9 16 A14 14 0 0 1 17 8" fill="none" stroke="#e0a868" stroke-width="1.8" stroke-linecap="round"/><g fill="#7a4a14" stroke="#000000" stroke-width="0.8"><circle cx="12" cy="24" r="2.4"/><circle cx="30" cy="12" r="2.4"/><circle cx="33" cy="26" r="2.4"/><circle cx="15" cy="33" r="2.4"/><circle cx="28" cy="34" r="2"/></g><circle cx="22" cy="19" r="4.4" fill="#ff00ff" stroke="#000000" stroke-width="1.2"/><polygon points="20,21 24,21 25.5,30 18.5,30" fill="#ff00ff" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
