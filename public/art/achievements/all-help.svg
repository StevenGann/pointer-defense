<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Well Read: unlock every Help page. A manual with every tab showing. First of the manual icons. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="31" y="8" width="7" height="5" fill="#ff0000" stroke="#000000"/><rect x="31" y="15" width="7" height="5" fill="#ffcc00" stroke="#000000"/><rect x="31" y="22" width="7" height="5" fill="#00a000" stroke="#000000"/><rect x="31" y="29" width="7" height="5" fill="#0000ff" stroke="#000000"/>
    <g transform="translate(20 22) scale(1.5) rotate(0)"><rect x="-9" y="-11" width="18" height="22" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9" y="-11" width="3.4" height="22" fill="#a87800" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="-3.4" y="-7" width="9.6" height="5" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g fill="#000000"><rect x="19.55" y="10.95" width="2.70" height="2.70"/><rect x="21.15" y="10.95" width="2.70" height="2.70"/><rect x="22.75" y="10.95" width="2.70" height="2.70"/><rect x="22.75" y="12.55" width="2.70" height="2.70"/><rect x="21.15" y="14.15" width="2.70" height="2.70"/><rect x="21.15" y="17.35" width="2.70" height="2.70"/></g><g fill="#000080"><rect x="20.10" y="11.50" width="1.95" height="1.95"/><rect x="21.70" y="11.50" width="1.95" height="1.95"/><rect x="23.30" y="11.50" width="1.95" height="1.95"/><rect x="23.30" y="13.10" width="1.95" height="1.95"/><rect x="21.70" y="14.70" width="1.95" height="1.95"/><rect x="21.70" y="17.90" width="1.95" height="1.95"/></g>
  </g>
</svg>
