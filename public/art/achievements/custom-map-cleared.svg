<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Cartographer: clear a wave on a custom map. A folded map with a route. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 22) scale(1.5) rotate(0)"><polygon points="-12,-8 -4,-10 4,-8 12,-10 12,8 4,10 -4,8 -12,10" fill="#fff8d8" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-4 -10 V8 M4 -8 V10" fill="none" stroke="#808080" stroke-width="1"/></g>
    <path d="M8 30 L15 20 L22 26 L30 14" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="3 2"/>
    <g transform="translate(31 14) scale(0.9) rotate(0)"><path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#000000" stroke-width="4.4" stroke-linecap="round"/><path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#ff0000" stroke-width="2.2" stroke-linecap="round"/></g>
  </g>
</svg>
