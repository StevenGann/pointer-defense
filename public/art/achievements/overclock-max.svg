<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Overclocked: buy every overclock tier. A chip running hot, with a bolt. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 22) scale(1.6) rotate(0)"><g stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-4 -7 V-10 M0 -7 V-10 M4 -7 V-10 M-4 7 V10 M0 7 V10 M4 7 V10 M-7 -4 H-10 M-7 0 H-10 M-7 4 H-10 M7 -4 H10 M7 0 H10 M7 4 H10" fill="none"/></g><rect x="-7" y="-7" width="14" height="14" fill="#ff7a1a" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-3.5" y="-3.5" width="7" height="7" fill="#ffff00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(22 22) scale(1.05) rotate(0)"><polygon points="2,-12 -6,2 -1,2 -3,12 6,-3 1,-3" fill="#ffff00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
