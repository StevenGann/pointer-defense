<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Five Tier Fives: five tier-5 towers at once. Five gold chevrons stacked. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 36) scale(0.95) rotate(0)"><polygon points="-10,3 0,-6 10,3 10,8 0,-1 -10,8" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(22 29.5) scale(0.95) rotate(0)"><polygon points="-10,3 0,-6 10,3 10,8 0,-1 -10,8" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(22 23) scale(0.95) rotate(0)"><polygon points="-10,3 0,-6 10,3 10,8 0,-1 -10,8" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(22 16.5) scale(0.95) rotate(0)"><polygon points="-10,3 0,-6 10,3 10,8 0,-1 -10,8" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(22 10) scale(0.95) rotate(0)"><polygon points="-10,3 0,-6 10,3 10,8 0,-1 -10,8" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
