<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- That Was Fair: use a cheat and still lose. A crown falling off a console prompt. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="3" y="24" width="38" height="16" fill="#000000" stroke="#808080" stroke-width="1.5"/>
    <g fill="#000000"><rect x="3.75" y="25.95" width="3.30" height="3.30"/><rect x="5.95" y="28.15" width="3.30" height="3.30"/><rect x="8.15" y="30.35" width="3.30" height="3.30"/><rect x="5.95" y="32.55" width="3.30" height="3.30"/><rect x="3.75" y="34.75" width="3.30" height="3.30"/><rect x="12.55" y="34.75" width="3.30" height="3.30"/><rect x="14.75" y="34.75" width="3.30" height="3.30"/><rect x="16.95" y="34.75" width="3.30" height="3.30"/></g><g fill="#ff00ff"><rect x="4.30" y="26.50" width="2.55" height="2.55"/><rect x="6.50" y="28.70" width="2.55" height="2.55"/><rect x="8.70" y="30.90" width="2.55" height="2.55"/><rect x="6.50" y="33.10" width="2.55" height="2.55"/><rect x="4.30" y="35.30" width="2.55" height="2.55"/><rect x="13.10" y="35.30" width="2.55" height="2.55"/><rect x="15.30" y="35.30" width="2.55" height="2.55"/><rect x="17.50" y="35.30" width="2.55" height="2.55"/></g>
    <g transform="translate(27 12) scale(1.1) rotate(28)"><polygon points="-9,5 -9,-4 -4.5,0.5 0,-6 4.5,0.5 9,-4 9,5" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9" y="4.5" width="18" height="3.5" fill="#a87800" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="0.5" r="1.4" fill="#ff0000" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <path d="M9 5 V13 M14 3 V9" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
