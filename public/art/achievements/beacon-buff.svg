<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Force Multiplier: a tower fires with 3 beacons boosting it. Three gold arrows into one tower. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 24) scale(0.85) rotate(0)"><rect x="-8" y="-8" width="16" height="16" fill="#008080" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-6.5 6.5 V-6.5 H6.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/><rect x="-1.8" y="-12" width="3.6" height="10" fill="#004a4a" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><circle r="4.5" fill="#004a4a" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(22 7) scale(0.9) rotate(180)"><polygon points="0,-6 5.5,0 2.2,0 2.2,6 -2.2,6 -2.2,0 -5.5,0" fill="#ffcc00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(6.5 34) scale(0.9) rotate(60)"><polygon points="0,-6 5.5,0 2.2,0 2.2,6 -2.2,6 -2.2,0 -5.5,0" fill="#ffcc00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(37.5 34) scale(0.9) rotate(-60)"><polygon points="0,-6 5.5,0 2.2,0 2.2,6 -2.2,6 -2.2,0 -5.5,0" fill="#ffcc00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
