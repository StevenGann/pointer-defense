<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Blue Screen: reboot while at wave 1. A blue error screen with a sad face. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(22 21) scale(1.5) rotate(0)"><rect x="-12" y="-11" width="24" height="18" fill="#c0c0c0" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9.5" y="-8.5" width="19" height="13" fill="#0000ff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="-3" y="7" width="6" height="3" fill="#808080" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="-7.5" y="10" width="15" height="2.6" fill="#c0c0c0" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g fill="#000000"><rect x="13.95" y="10.15" width="3.30" height="3.30"/><rect x="13.95" y="14.55" width="3.30" height="3.30"/><rect x="24.95" y="7.95" width="3.30" height="3.30"/><rect x="22.75" y="10.15" width="3.30" height="3.30"/><rect x="22.75" y="12.35" width="3.30" height="3.30"/><rect x="22.75" y="14.55" width="3.30" height="3.30"/><rect x="24.95" y="16.75" width="3.30" height="3.30"/></g><g fill="#ffffff"><rect x="14.50" y="10.70" width="2.55" height="2.55"/><rect x="14.50" y="15.10" width="2.55" height="2.55"/><rect x="25.50" y="8.50" width="2.55" height="2.55"/><rect x="23.30" y="10.70" width="2.55" height="2.55"/><rect x="23.30" y="12.90" width="2.55" height="2.55"/><rect x="23.30" y="15.10" width="2.55" height="2.55"/><rect x="25.50" y="17.30" width="2.55" height="2.55"/></g>
    <path d="M11 24 H31" stroke="#ffffff" stroke-width="1.4"/>
  </g>
</svg>
