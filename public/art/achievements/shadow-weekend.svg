<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Weekend Warrior: clear a wave on a Sunday. A calendar with one day circled. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="5" y="7" width="34" height="33" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><rect x="5" y="7" width="34" height="8" fill="#ff0000" stroke="#000000" stroke-width="1.5"/><path d="M13 3 V10 M31 3 V10" stroke="#000000" stroke-width="2.6" stroke-linecap="round"/><g fill="#808080"><rect x="16" y="19" width="4" height="4"/><rect x="23" y="19" width="4" height="4"/><rect x="30" y="19" width="4" height="4"/><rect x="16" y="26" width="4" height="4"/><rect x="23" y="26" width="4" height="4"/><rect x="30" y="26" width="4" height="4"/><rect x="9" y="33" width="4" height="4"/><rect x="16" y="33" width="4" height="4"/></g><rect x="9" y="19" width="4" height="4" fill="#ff0000"/><rect x="9" y="26" width="4" height="4" fill="#ff0000"/><circle cx="11" cy="28" r="5" fill="none" stroke="#000080" stroke-width="1.8"/>
  </g>
</svg>
