<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Split Decision: clear wave 10 on The Fork. A road that forks round a median. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <path d="M22 42 V28 Q22 20 10 12 V3 M22 28 Q22 20 34 12 V3" fill="none" stroke="#000000" stroke-width="9.4" stroke-linejoin="round"/><path d="M22 42 V28 Q22 20 10 12 V3 M22 28 Q22 20 34 12 V3" fill="none" stroke="#808080" stroke-width="6.6" stroke-linejoin="round"/><path d="M22 42 V28 Q22 20 10 12 V3 M22 28 Q22 20 34 12 V3" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3"/><polygon points="22,10 26,18 18,18" fill="#00a000" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
