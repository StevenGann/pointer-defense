<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Flak Jacket: branch an AA tower into Flak. A shell bursting into a ring of shrapnel. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(0 22 22)"/><polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(45 22 22)"/><polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(90 22 22)"/><polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(135 22 22)"/><polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(180 22 22)"/><polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(225 22 22)"/><polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(270 22 22)"/><polygon points="22,3 25,11 19,11" fill="#5a7d9a" stroke="#000000" stroke-width="1.2" stroke-linejoin="round" transform="rotate(315 22 22)"/>
    <g transform="translate(22 22) scale(1) rotate(0)"><polygon points="0,-11.00 3.30,-3.30 11.00,0 3.30,3.30 0,11.00 -3.30,3.30 -11.00,0 -3.30,-3.30" fill="#ff7a1a" stroke="#000000" stroke-width="1" stroke-linejoin="round"/></g>
    <circle cx="22" cy="22" r="3.4" fill="#ffff00" stroke="#000000"/>
  </g>
</svg>
