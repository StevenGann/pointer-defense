<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Brick by Brick: clear a wave with walls and no damage towers. Three courses of brick. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="4" y="26" width="17" height="9" fill="#b04020" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="21" y="26" width="19" height="9" fill="#b04020" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="4" y="17" width="9" height="9" fill="#b04020" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="13" y="17" width="18" height="9" fill="#b04020" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="31" y="17" width="9" height="9" fill="#b04020" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="9" y="8" width="17" height="9" fill="#b04020" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="26" y="8" width="12" height="9" fill="#b04020" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M5.5 27.5 H19.5 M22.5 27.5 H38.5 M14.5 18.5 H29.5 M10.5 9.5 H24.5" stroke="#ffb090" stroke-width="1"/>
  </g>
</svg>
