<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Beginner's Luck: a crit in the first wave. One spark off a cursor tip. First of three crit icons. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(16 16) scale(1.1) rotate(0)"><polygon points="0,0 0,17 4,13.4 6.8,19.6 9.4,18.4 6.7,12.4 12,12.4" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(14 13) scale(1) rotate(0)"><polygon points="0,-9.00 2.70,-2.70 9.00,0 2.70,2.70 0,9.00 -2.70,2.70 -9.00,0 -2.70,-2.70" fill="#ffff00" stroke="#000000" stroke-width="1" stroke-linejoin="round"/></g>
  </g>
</svg>
