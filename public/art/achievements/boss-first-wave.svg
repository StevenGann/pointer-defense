<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Early Grave: kill a boss before wave 20. A gravestone wearing the crown. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <path d="M9 40 V20 A13 13 0 0 1 35 20 V40 Z" fill="#c0c0c0" stroke="#000000" stroke-width="1.5"/><path d="M11 38 V20 A11 11 0 0 1 22 9" fill="none" stroke="#ffffff" stroke-width="1.4"/><path d="M22 20 V33 M16.5 25 H27.5" stroke="#808080" stroke-width="3"/><rect x="4" y="38.5" width="36" height="3.5" fill="#00a000" stroke="#000000"/>
    <g transform="translate(22 8) scale(0.8) rotate(0)"><polygon points="-9,5 -9,-4 -4.5,0.5 0,-6 4.5,0.5 9,-4 9,5" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-9" y="4.5" width="18" height="3.5" fill="#a87800" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="0.5" r="1.4" fill="#ff0000" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
