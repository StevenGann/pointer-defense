<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Thrift: clear a wave spending nothing. A piggy bank with its slot taped shut. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <path d="M10 30 V37 M15 31 V38 M27 31 V38 M32 30 V37" stroke="#000000" stroke-width="4.4" stroke-linecap="round"/><path d="M10 30 V37 M15 31 V38 M27 31 V38 M32 30 V37" stroke="#ff9ab8" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="21" cy="23" rx="15" ry="11" fill="#ff9ab8" stroke="#000000" stroke-width="1.5"/><polygon points="27,13 33,9 33,16" fill="#ff9ab8" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/><rect x="33" y="19" width="7" height="8" rx="2" fill="#ff6a98" stroke="#000000" stroke-width="1.2"/><circle cx="29" cy="19" r="1.4" fill="#000000"/><rect x="15" y="13.5" width="9" height="2.4" fill="#000000"/><rect x="13" y="11" width="13" height="7" fill="#fff8d8" stroke="#000000" opacity="0.9" transform="rotate(-12 19.5 14.5)"/>
  </g>
</svg>
