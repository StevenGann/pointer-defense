<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Rally: clear five waves in a row after losing integrity. Five rising steps, the first one patched. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <polygon points="3,40 3,32 10.5,32 10.5,26 18,26 18,20 25.5,20 25.5,14 33,14 33,8 41,8 41,40" fill="#00a000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.5 33.5 H10.5 M12 27.5 H18 M19.5 21.5 H25.5 M27 15.5 H33 M34.5 9.5 H39.5" stroke="#7fe07f" stroke-width="1.2"/><rect x="2" y="34" width="10" height="4.6" fill="#fff8d8" stroke="#000000" transform="rotate(-18 7 36)"/><path d="M5.5 36.4 H8.5 M7 34.9 V37.9" stroke="#ff0000" stroke-width="1.2" transform="rotate(-18 7 36)"/>
  </g>
</svg>
