<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Early Adopter: call a wave early before building. One green arrow on a button. First of three early-call icons. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="6" y="9" width="32" height="26" fill="#c0c0c0" stroke="#000000" stroke-width="1.5"/><path d="M7.5 33.5 V10.5 H36.5" fill="none" stroke="#ffffff" stroke-width="1.4"/><path d="M36.5 10.5 V33.5 H7.5" fill="none" stroke="#808080" stroke-width="1.4"/>
    <g transform="translate(22 22) scale(1.5) rotate(0)"><polygon points="-4,-6 6,0 -4,6" fill="#00ff00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M-2.9 -4 L3.6 -0.2" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9" opacity="0.8"/><path d="M-2.9 4 L3.6 0.4" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9" opacity="0.22"/></g>
  </g>
</svg>
