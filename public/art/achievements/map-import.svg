<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Import Duty: load a map from a code. A floppy disk with an arrow in. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(18 25) scale(1.4) rotate(0)"><polygon points="-10,-10 7,-10 10,-7 10,10 -10,10" fill="#000080" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-5" y="-10" width="9" height="6.5" fill="#dfdfdf" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="0.5" y="-9" width="2.2" height="4.4" fill="#000080"/><rect x="-7" y="0.5" width="14" height="9.5" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <g transform="translate(33 12) scale(1.5) rotate(225)"><polygon points="0,-6 5.5,0 2.2,0 2.2,6 -2.2,6 -2.2,0 -5.5,0" fill="#ffcc00" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
</svg>
