<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Paper Jam: spawn 50 enemies from the cheat menu, then lose. A printer chewing a sheet. First of three cheat icons, all marked in magenta. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <polygon points="12,4 32,4 30,10 33,15 12,15" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/><path d="M15 8 H27 M15 11.5 H24" stroke="#808080" stroke-width="1.2"/><rect x="4" y="15" width="36" height="16" fill="#c0c0c0" stroke="#000000" stroke-width="1.5"/><path d="M5.5 29.5 V16.5 H38.5" fill="none" stroke="#ffffff" stroke-width="1.2"/><path d="M38.5 16.5 V29.5 H5.5" fill="none" stroke="#808080" stroke-width="1.2"/><rect x="8" y="18.6" width="18" height="2.4" fill="#000000"/><rect x="9" y="26" width="26" height="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M12 30 L16 33 L20 30 L24 33 L28 30 L32 33" fill="none" stroke="#000000" stroke-width="1.2"/><path d="M12 35.4 H26" stroke="#c0c0c0" stroke-width="1"/><circle cx="34" cy="20" r="2.2" fill="#ff00ff" stroke="#000000"/><circle cx="33.4" cy="19.4" r="0.7" fill="#ffffff"/><rect x="28" y="19" width="2.4" height="2" fill="#00a000" stroke="#000000" stroke-width="0.6"/>
  </g>
</svg>
