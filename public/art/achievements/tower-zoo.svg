<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Full House: one of every tower kind at once. Nine towers in their colours. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="5" y="5" width="10" height="10" fill="#008080" stroke="#000000" stroke-width="1.2"/><circle cx="10" cy="10" r="2.2" fill="#000000" opacity="0.45"/><rect x="17" y="5" width="10" height="10" fill="#800000" stroke="#000000" stroke-width="1.2"/><circle cx="22" cy="10" r="2.2" fill="#000000" opacity="0.45"/><rect x="29" y="5" width="10" height="10" fill="#ff3300" stroke="#000000" stroke-width="1.2"/><circle cx="34" cy="10" r="2.2" fill="#000000" opacity="0.45"/><rect x="5" y="17" width="10" height="10" fill="#808000" stroke="#000000" stroke-width="1.2"/><circle cx="10" cy="22" r="2.2" fill="#000000" opacity="0.45"/><rect x="17" y="17" width="10" height="10" fill="#3399cc" stroke="#000000" stroke-width="1.2"/><circle cx="22" cy="22" r="2.2" fill="#000000" opacity="0.45"/><rect x="29" y="17" width="10" height="10" fill="#ffcc00" stroke="#000000" stroke-width="1.2"/><circle cx="34" cy="22" r="2.2" fill="#000000" opacity="0.45"/><rect x="5" y="29" width="10" height="10" fill="#00a000" stroke="#000000" stroke-width="1.2"/><circle cx="10" cy="34" r="2.2" fill="#000000" opacity="0.45"/><rect x="17" y="29" width="10" height="10" fill="#9a9a9a" stroke="#000000" stroke-width="1.2"/><circle cx="22" cy="34" r="2.2" fill="#000000" opacity="0.45"/><rect x="29" y="29" width="10" height="10" fill="#5a7d9a" stroke="#000000" stroke-width="1.2"/><circle cx="34" cy="34" r="2.2" fill="#000000" opacity="0.45"/>
  </g>
</svg>
