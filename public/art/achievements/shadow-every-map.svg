  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="2" y="4" width="40" height="36" fill="#c0803c" stroke="#000000" stroke-width="1.5"/>
    <rect x="6" y="8" width="9" height="12" fill="#fff8d8" stroke="#000000" stroke-width="1"/><path d="M7 17 l2.5 -4 l2 3 l2.5 -4" fill="none" stroke="#ff0000" stroke-width="1"/><circle cx="10.5" cy="8" r="1.5" fill="#ff0000" stroke="#000000" stroke-width="0.6"/><rect x="17.5" y="8" width="9" height="12" fill="#fff8d8" stroke="#000000" stroke-width="1"/><path d="M18.5 17 l2.5 -4 l2 3 l2.5 -4" fill="none" stroke="#ff0000" stroke-width="1"/><circle cx="22" cy="8" r="1.5" fill="#ff0000" stroke="#000000" stroke-width="0.6"/><rect x="29" y="8" width="9" height="12" fill="#fff8d8" stroke="#000000" stroke-width="1"/><path d="M30 17 l2.5 -4 l2 3 l2.5 -4" fill="none" stroke="#ff0000" stroke-width="1"/><circle cx="33.5" cy="8" r="1.5" fill="#ff0000" stroke="#000000" stroke-width="0.6"/><rect x="6" y="23" width="9" height="12" fill="#fff8d8" stroke="#000000" stroke-width="1"/><path d="M7 32 l2.5 -4 l2 3 l2.5 -4" fill="none" stroke="#ff0000" stroke-width="1"/><circle cx="10.5" cy="23" r="1.5" fill="#ff0000" stroke="#000000" stroke-width="0.6"/><rect x="17.5" y="23" width="9" height="12" fill="#fff8d8" stroke="#000000" stroke-width="1"/><path d="M18.5 32 l2.5 -4 l2 3 l2.5 -4" fill="none" stroke="#ff0000" stroke-width="1"/><circle cx="22" cy="23" r="1.5" fill="#ff0000" stroke="#000000" stroke-width="0.6"/><rect x="29" y="23" width="9" height="12" fill="#fff8d8" stroke="#000000" stroke-width="1"/><path d="M30 32 l2.5 -4 l2 3 l2.5 -4" fill="none" stroke="#ff0000" stroke-width="1"/><circle cx="33.5" cy="23" r="1.5" fill="#ff0000" stroke="#000000" stroke-width="0.6"/>
