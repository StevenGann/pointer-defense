<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Day Trader: sell a tower in the wave you built it. A price tag with a return arrow. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <g transform="translate(21 26) scale(1.25) rotate(-20)"><polygon points="-11,0 -5,-7 10,-7 10,7 -5,7" fill="#ffcc00" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5.5" cy="0" r="1.7" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>
    <path d="M9 15 A14 14 0 0 1 35 13" fill="none" stroke="#000000" stroke-width="4.4"/><path d="M9 15 A14 14 0 0 1 35 13" fill="none" stroke="#00ff00" stroke-width="2.2"/><polygon points="3.5,11 12,10.5 9.5,19" fill="#00ff00" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
