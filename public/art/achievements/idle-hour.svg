<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Background Task: leave auto-wave running for 5 minutes. A taskbar with one lit task. -->
  <!-- The frame: a raised Windows 95 button. White and light grey on the top and left, grey and black on the bottom and right. -->
  <rect x="0" y="0" width="44" height="44" fill="#c0c0c0"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The glyph, drawn in a 44-unit box and scaled to sit inside the frame. -->
  <g transform="translate(22 22) scale(0.84) translate(-22 -22)">
    <rect x="3" y="24" width="38" height="13" fill="#c0c0c0" stroke="#000000" stroke-width="1.5"/><path d="M4 25.5 H40" stroke="#ffffff" stroke-width="1.2"/><rect x="5.5" y="27" width="11" height="8" fill="#c0c0c0" stroke="#000000"/><rect x="7.5" y="29" width="3" height="3" fill="#ff0000"/><rect x="10.5" y="29" width="3" height="3" fill="#00a000"/><rect x="19" y="27" width="10" height="8" fill="#dfdfdf" stroke="#000000"/><rect x="21.5" y="29" width="5" height="4" fill="#00ff00" stroke="#000000" stroke-width="0.8"/><rect x="31" y="27" width="8.5" height="8" fill="#c0c0c0" stroke="#808080"/>
    <g transform="translate(24 12) scale(0.6) rotate(0)"><polygon points="0,-9.00 2.70,-2.70 9.00,0 2.70,2.70 0,9.00 -2.70,2.70 -9.00,0 -2.70,-2.70" fill="#00ff00" stroke="#000000" stroke-width="1" stroke-linejoin="round"/></g>
  </g>
</svg>
