<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 3 of 6. Frame 2 fading out over frame 4 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <g fill="none" stroke="#5a5a5a" stroke-width="2.8"><circle cx="12.2" cy="10" r="3"/><circle cx="19.8" cy="10" r="3"/></g>
    <g fill="none" stroke="#e8e8e8" stroke-width="1.5"><circle cx="12.2" cy="10" r="3"/><circle cx="19.8" cy="10" r="3"/></g>
    <g fill="#ff9a2e" stroke="#5a1400" stroke-width="0.6" stroke-linejoin="round">
      <polygon points="12.2,5.4 13.4,9.6 12.2,11.4 11,9.6"/><polygon points="19.8,5.4 21,9.6 19.8,11.4 18.6,9.6"/>
    </g>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <defs><g id="b-f"><circle cx="11.6" cy="11" r="3.6"/><circle cx="20.4" cy="11" r="3.6"/><circle cx="16" cy="12.6" r="2.8"/></g></defs>
    <use href="#b-f" fill="#5a5a5a" stroke="#5a5a5a" stroke-width="1.4" stroke-linejoin="round"/>
    <use href="#b-f" fill="#b4b4b4"/>
    <circle cx="10.6" cy="10" r="1.3" fill="#e0e0e0"/><circle cx="19.4" cy="10" r="1.3" fill="#e0e0e0"/>
  </g>
  </g>
</svg>
