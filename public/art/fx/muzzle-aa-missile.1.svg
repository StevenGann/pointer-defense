<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 1 of 6. Frame 0 fading out over frame 2 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <g transform="translate(12.5 0) scale(0.62 1) translate(-16 0)">
    <polygon points="16,6 18.2,9.6 16,12.4 13.8,9.6" fill="#ff9a2e" stroke="#5a1400" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,8 17,9.8 16,11.2 15,9.8" fill="#ffffff"/>
    </g>
    <g transform="translate(19.5 0) scale(0.62 1) translate(-16 0)">
    <polygon points="16,6 18.2,9.6 16,12.4 13.8,9.6" fill="#ff9a2e" stroke="#5a1400" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,8 17,9.8 16,11.2 15,9.8" fill="#ffffff"/>
    </g>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <g fill="none" stroke="#5a5a5a" stroke-width="2.8"><circle cx="12.2" cy="10" r="3"/><circle cx="19.8" cy="10" r="3"/></g>
    <g fill="none" stroke="#e8e8e8" stroke-width="1.5"><circle cx="12.2" cy="10" r="3"/><circle cx="19.8" cy="10" r="3"/></g>
    <g fill="#ff9a2e" stroke="#5a1400" stroke-width="0.6" stroke-linejoin="round">
      <polygon points="12.2,5.4 13.4,9.6 12.2,11.4 11,9.6"/><polygon points="19.8,5.4 21,9.6 19.8,11.4 18.6,9.6"/>
    </g>
  </g>
  </g>
</svg>
