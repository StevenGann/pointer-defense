<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 5 of 8. Frame 4 fading out over frame 6 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <defs><g id="a-f"><circle cx="16" cy="6.2" r="6.2"/><circle cx="10.6" cy="9.8" r="3.2"/><circle cx="21.4" cy="9.8" r="3.2"/><circle cx="16" cy="1.9" r="1.9"/></g></defs>
    <use href="#a-f" fill="#5a1400" stroke="#5a1400" stroke-width="1.8" stroke-linejoin="round"/>
    <use href="#a-f" fill="#e8701a"/>
    <circle cx="16" cy="6.6" r="3.8" fill="#8a8a8a"/>
    <circle cx="14.8" cy="5.4" r="1.5" fill="#b4b4b4"/>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <defs><g id="b-f"><circle cx="16" cy="5" r="4.4"/><circle cx="10.6" cy="9.4" r="3"/><circle cx="21.4" cy="9.4" r="3"/></g></defs>
    <use href="#b-f" fill="#5a5a5a" stroke="#5a5a5a" stroke-width="1.4" stroke-linejoin="round"/>
    <use href="#b-f" fill="#9a9a9a"/>
    <circle cx="14.6" cy="3.8" r="1.5" fill="#c8c8c8"/>
    <circle cx="9.8" cy="8.6" r="1" fill="#c8c8c8"/>
  </g>
  </g>
</svg>
