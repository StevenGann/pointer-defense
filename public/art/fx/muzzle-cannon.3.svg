<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 3 of 8. Frame 2 fading out over frame 4 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <defs><g id="a-f"><circle cx="16" cy="7" r="5.6"/><circle cx="11.6" cy="9.6" r="3"/><circle cx="20.4" cy="9.6" r="3"/><circle cx="16" cy="2.8" r="2.4"/></g></defs>
    <use href="#a-f" fill="#5a1400" stroke="#5a1400" stroke-width="1.8" stroke-linejoin="round"/>
    <use href="#a-f" fill="#ff9a2e"/>
    <circle cx="16" cy="7.4" r="3.6" fill="#ffe28a"/>
    <circle cx="16" cy="8" r="1.9" fill="#ffffff"/>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <defs><g id="b-f"><circle cx="16" cy="6.2" r="6.2"/><circle cx="10.6" cy="9.8" r="3.2"/><circle cx="21.4" cy="9.8" r="3.2"/><circle cx="16" cy="1.9" r="1.9"/></g></defs>
    <use href="#b-f" fill="#5a1400" stroke="#5a1400" stroke-width="1.8" stroke-linejoin="round"/>
    <use href="#b-f" fill="#e8701a"/>
    <circle cx="16" cy="6.6" r="3.8" fill="#8a8a8a"/>
    <circle cx="14.8" cy="5.4" r="1.5" fill="#b4b4b4"/>
  </g>
  </g>
</svg>
