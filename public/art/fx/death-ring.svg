<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A death. White, because the engine tints it to the enemy's colour; grey reads as a darker
       shade of that colour. The ring radius is 12 and must stay 12: the engine scales from it.
       Frame 0: the ring whole, three shards near the centre. -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <circle cx="16" cy="16" r="10.6" fill="none" stroke="#b0b0b0" stroke-width="0.6"/>
  <g fill="#ffffff">
    <polygon points="20.5,16 23.5,14.2 26,16 23.5,17.8"/><polygon points="20.5,16 23.5,14.2 26,16 23.5,17.8" transform="rotate(120 16 16)"/><polygon points="20.5,16 23.5,14.2 26,16 23.5,17.8" transform="rotate(240 16 16)"/>
  </g>
</svg>
