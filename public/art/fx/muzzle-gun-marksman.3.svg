<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 3 of 6. Frame 2 fading out over frame 4 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <polygon points="17,9 24.5,8.2 22,9.8 24,11.6 17,11" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="15,9 7.5,8.2 10,9.8 8,11.6 15,11" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,0.4 17.5,8 16,12.8 14.5,8" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,3.5 16.8,8.6 16,11.6 15.2,8.6" fill="#ffffff"/>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <ellipse cx="16" cy="10.4" rx="6" ry="2.2" fill="none" stroke="#7a4a00" stroke-width="2" opacity="0.5"/>
    <ellipse cx="16" cy="10.4" rx="6" ry="2.2" fill="none" stroke="#ffd75e" stroke-width="1"/>
    <polygon points="16,0.4 16.9,6 16,9 15.1,6" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
