<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- An Overclock click: the same rays in yellow, round a lightning bolt. -->
  <g fill="#ffe14a" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"><polygon points="16,1.8 17.7,6.8 14.3,6.8" transform="rotate(0 16 16)"/><polygon points="16,1.8 17.7,6.8 14.3,6.8" transform="rotate(60 16 16)"/><polygon points="16,1.8 17.7,6.8 14.3,6.8" transform="rotate(120 16 16)"/><polygon points="16,1.8 17.7,6.8 14.3,6.8" transform="rotate(180 16 16)"/><polygon points="16,1.8 17.7,6.8 14.3,6.8" transform="rotate(240 16 16)"/><polygon points="16,1.8 17.7,6.8 14.3,6.8" transform="rotate(300 16 16)"/></g>
  <polygon points="18.2,8.6 11.6,17 15,17 13,23.6 20.4,14.8 17,14.8" fill="#ffe14a" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
