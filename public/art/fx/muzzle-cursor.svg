<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A cursor click. Drawn at half a cell, so every shape is bold. Six rays round the click point. -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"><polygon points="16,2.4 18,9 14,9" transform="rotate(0 16 16)"/><polygon points="16,2.4 18,9 14,9" transform="rotate(60 16 16)"/><polygon points="16,2.4 18,9 14,9" transform="rotate(120 16 16)"/><polygon points="16,2.4 18,9 14,9" transform="rotate(180 16 16)"/><polygon points="16,2.4 18,9 14,9" transform="rotate(240 16 16)"/><polygon points="16,2.4 18,9 14,9" transform="rotate(300 16 16)"/></g>
  <circle cx="16" cy="16" r="2.8" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
</svg>
