<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 1 of 6. Frame 0 fading out over frame 2 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <g transform="translate(12.5 0) scale(0.62 1) translate(-16 0)">
    <polygon points="16,6 18.2,9.6 16,12.4 13.8,9.6" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,8 17,9.8 16,11.2 15,9.8" fill="#ffffff"/>
    </g>
    <g transform="translate(19.5 0) scale(0.62 1) translate(-16 0)">
    <polygon points="16,6 18.2,9.6 16,12.4 13.8,9.6" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,8 17,9.8 16,11.2 15,9.8" fill="#ffffff"/>
    </g>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <g transform="translate(12.5 0) scale(0.62 1) translate(-16 0)">
    <polygon points="16,1.2 17.9,7.6 22.4,5 19.2,10.4 16,12.8 12.8,10.4 9.6,5 14.1,7.6" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,4.6 17.2,9.4 16,11.6 14.8,9.4" fill="#ffffff"/>
    </g>
    <g transform="translate(19.5 0) scale(0.62 1) translate(-16 0)">
    <polygon points="16,1.2 17.9,7.6 22.4,5 19.2,10.4 16,12.8 12.8,10.4 9.6,5 14.1,7.6" fill="#ffd75e" stroke="#7a4a00" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,4.6 17.2,9.4 16,11.6 14.8,9.4" fill="#ffffff"/>
    </g>
  </g>
  </g>
</svg>
