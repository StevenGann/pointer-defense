<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 3 of 6. Frame 2 fading out over frame 4 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <polygon points="16,0.3 17.1,9.2 16,13.4 14.9,9.2" fill="#ff9a7a" stroke="#7a1800" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="16" cy="10.2" r="3.8" fill="none" stroke="#7a1800" stroke-width="2.4"/>
    <circle cx="16" cy="10.2" r="3.8" fill="none" stroke="#ff3300" stroke-width="1.2"/>
    <circle cx="16" cy="10.2" r="1.7" fill="#ffffff"/>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <circle cx="16" cy="10.2" r="5.6" fill="none" stroke="#7a1800" stroke-width="1.8" opacity="0.5"/>
    <circle cx="16" cy="10.2" r="5.6" fill="none" stroke="#ff6a40" stroke-width="0.9"/>
    <polygon points="16,0.6 16.8,7 16,9.6 15.2,7" fill="#ff9a7a" stroke="#7a1800" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
