<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 1 of 6. Frame 0 fading out over frame 2 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <circle cx="16" cy="10.8" r="4.4" fill="#ff9a2e" stroke="#5a1400" stroke-width="0.9"/>
    <circle cx="16" cy="10.8" r="2.6" fill="#ffffff"/>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <g fill="#ff9a2e" stroke="#5a1400" stroke-width="0.8" stroke-linejoin="round"><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(0 16 10.8)"/><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(45 16 10.8)"/><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(90 16 10.8)"/><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(135 16 10.8)"/><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(180 16 10.8)"/><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(225 16 10.8)"/><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(270 16 10.8)"/><polygon points="16,0.9 17.1,4 14.9,4" transform="rotate(315 16 10.8)"/></g>
    <circle cx="16" cy="10.8" r="5.6" fill="none" stroke="#5a1400" stroke-width="3.4"/>
    <circle cx="16" cy="10.8" r="5.6" fill="none" stroke="#ff9a2e" stroke-width="2"/>
    <circle cx="16" cy="10.8" r="2.6" fill="#ffe28a"/>
  </g>
  </g>
</svg>
