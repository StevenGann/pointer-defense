<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Death ring: in-between 3 of 6. Frame 2 fading out over frame 4 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="9.57 3"/>
  <g fill="#ffffff">
    <polygon points="20.5,16 23.5,14.2 26,16 23.5,17.8" transform="rotate(50 23.2 16)"/>
    <polygon points="20.5,16 23.5,14.2 26,16 23.5,17.8" transform="rotate(120 16 16) rotate(50 23.2 16)"/>
    <polygon points="20.5,16 23.5,14.2 26,16 23.5,17.8" transform="rotate(240 16 16) rotate(50 23.2 16)"/>
  </g>
  </g>
  <g opacity="0.6">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="5.57 7" stroke-dashoffset="-2"/>
  <g fill="#ffffff">
    <polygon points="21.6,16 23.3,14.9 24.8,16 23.3,17.1" transform="rotate(100 23.2 16)"/>
    <polygon points="21.6,16 23.3,14.9 24.8,16 23.3,17.1" transform="rotate(120 16 16) rotate(100 23.2 16)"/>
    <polygon points="21.6,16 23.3,14.9 24.8,16 23.3,17.1" transform="rotate(240 16 16) rotate(100 23.2 16)"/>
  </g>
  </g>
</svg>
