<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 1 of 6. Frame 0 fading out over frame 2 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <circle cx="16" cy="10" r="2.8" fill="#b8894a" stroke="#5a3c14" stroke-width="0.8"/>
    <circle cx="16" cy="10" r="1.3" fill="#ffffff"/>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <circle cx="16" cy="9.8" r="4.6" fill="none" stroke="#5a3c14" stroke-width="3"/>
    <circle cx="16" cy="9.8" r="4.6" fill="none" stroke="#d8a860" stroke-width="1.6"/>
    <path d="M12.4 4.6 L16 1.8 L19.6 4.6" fill="none" stroke="#5a3c14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12.4 4.6 L16 1.8 L19.6 4.6" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
