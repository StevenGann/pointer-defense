  <g fill="#00e5ff" stroke="#00303c" stroke-width="0.9" stroke-linejoin="miter">
  <path d="M3 3 H11 V5.4 H5.4 V11 H3 Z"/><path d="M29 3 H21 V5.4 H26.6 V11 H29 Z"/>
