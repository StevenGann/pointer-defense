<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A gold ring, gold at the rim fading to transparent at the centre. Frame 0: smallest. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ffcc00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="12" fill="url(#g)"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="#ffcc00" stroke-width="2"/>
</svg>
