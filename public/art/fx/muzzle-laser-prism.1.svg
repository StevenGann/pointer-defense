<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Muzzle flash: in-between 1 of 6. Frame 0 fading out over frame 2 fading in, so the
       sequence has a step on every simulation tick. -->
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <polygon points="16,6.4 19,12 13,12" fill="#ffffff" stroke="#7a1800" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,8.6 17.4,11.2 14.6,11.2" fill="#ffb499"/>
  </g>
  </g>
  <g opacity="0.6">
  <g transform="rotate(90 16 16)">
        <polygon points="16,0.8 17.2,9.4 14.8,9.4" fill="#ffd75e" stroke="#7a1800" stroke-width="0.8" stroke-linejoin="round" transform="rotate(-34 16 10.6)"/>
    <polygon points="16,0.8 17.2,9.4 14.8,9.4" fill="#c05cff" stroke="#7a1800" stroke-width="0.8" stroke-linejoin="round" transform="rotate(34 16 10.6)"/>
    <polygon points="16,0.8 17.2,9.4 14.8,9.4" fill="#ff3300" stroke="#7a1800" stroke-width="0.8" stroke-linejoin="round"/>
    <polygon points="16,7.6 18.2,11.8 13.8,11.8" fill="#ffffff" stroke="#7a1800" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
