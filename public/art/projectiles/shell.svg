<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A flak shell, nose up (the engine turns it to its heading). It is drawn at about 5 px, so
       it fills the box and has a 3-unit outline. Two frames flicker the tracer. Frame 0: long. -->
  <polygon points="10,22 22,22 16,31.5" fill="#ff7a1a"/>
  <polygon points="13,22 19,22 16,28" fill="#ffffff"/>
  <defs>
    <linearGradient id="brass" x1="8" y1="0" x2="24" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="0.45" stop-color="#d8a030"/>
      <stop offset="1" stop-color="#7a5200"/>
    </linearGradient>
  </defs>
  <path d="M8.5 22 V12 Q8.5 3 16 1.5 Q23.5 3 23.5 12 V22 Z" fill="url(#brass)" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="8.5" y="16" width="15" height="3" fill="#5a3c00"/>
</svg>
