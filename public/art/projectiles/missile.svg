<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A homing missile, nose up (the engine turns it to its heading). Drawn at half a cell.
       Three frames flicker the motor flame; the body does not move. Frame 0: a long flame. -->
  <polygon points="13.2,23.6 18.8,23.6 17.4,27 16,31.4 14.6,27" fill="#ff7a1a" stroke="#5a1400" stroke-width="0.9" stroke-linejoin="round"/>
  <polygon points="14.6,23.8 17.4,23.8 16,28.2" fill="#ffe28a"/>
  <defs>
    <linearGradient id="body" x1="12" y1="0" x2="20" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.45" stop-color="#b8c4cc"/>
      <stop offset="1" stop-color="#5a6a76"/>
    </linearGradient>
  </defs>
  <!-- Fins, then the body, then the nose cone. -->
  <g fill="#5a7d9a" stroke="#000000" stroke-width="1.4" stroke-linejoin="round">
    <polygon points="12.4,15.5 6.6,22.6 12.4,21.4"/>
    <polygon points="19.6,15.5 25.4,22.6 19.6,21.4"/>
  </g>
  <path d="M12.4 8.6 L16 1.6 L19.6 8.6 V22 H12.4 Z" fill="url(#body)" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12.9 8.4 L16 2.4 L19.1 8.4 Z" fill="#c02000"/>
  <path d="M13.6 8 L16 3.4 L16 8 Z" fill="#ff6a4a"/>
  <rect x="12.4" y="12.6" width="7.2" height="1.8" fill="#2f4a5e"/>
  <rect x="13.4" y="21.4" width="5.2" height="2" fill="#2a2a2a" stroke="#000000" stroke-width="0.8"/>
</svg>
