<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shell" cx="12" cy="11" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a8ca6"/>
      <stop offset="0.5" stop-color="#2f4b62"/>
      <stop offset="1" stop-color="#152431"/>
    </radialGradient>
  </defs>
  <!-- The projector frame: a glassy hexagon with an emitter node on every vertex. -->
  <polygon points="16,2 28.1,9 28.1,23 16,30 3.9,23 3.9,9" fill="#9fd0ea" fill-opacity="0.16" stroke="#000000" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="16,2 28.1,9 28.1,23 16,30 3.9,23 3.9,9" fill="none" stroke="#5d86a3" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="#2f4b62" stroke="#000000" stroke-width="0.6">
    <circle cx="16" cy="2.3" r="1.3"/>
    <circle cx="27.9" cy="9.1" r="1.3"/>
    <circle cx="27.9" cy="22.9" r="1.3"/>
    <circle cx="16" cy="29.7" r="1.3"/>
    <circle cx="4.1" cy="22.9" r="1.3"/>
    <circle cx="4.1" cy="9.1" r="1.3"/>
  </g>
  <!-- The body. -->
  <circle cx="16" cy="16" r="10.5" fill="url(#shell)" stroke="#000000" stroke-width="1"/>
  <path d="M7.14 13.63 A9.2 9.2 0 0 1 13.63 7.14" fill="none" stroke="#a9c4d6" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- A visor with two eyes behind it. -->
  <rect x="9.2" y="13.2" width="13.6" height="5" rx="2.2" fill="#0a141c" stroke="#000000" stroke-width="0.6"/>
  <!-- Walk frame 4 of 8: back to centre, the same pose as frame 0. -->
  <circle cx="13" cy="15.7" r="1.35" fill="#bfe6ff"/>
  <circle cx="19" cy="15.7" r="1.35" fill="#bfe6ff"/>
  <line x1="10.6" y1="14.2" x2="15" y2="14.2" stroke="#ffffff" stroke-width="0.6" opacity="0.35" stroke-linecap="round"/>
</svg>
