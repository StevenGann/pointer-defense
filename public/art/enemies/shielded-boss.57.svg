<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- In-between: every moving part sits halfway between its neighbouring frames. -->
  <!-- Bastion (shielded-boss), frame 57 of 64. Generated: every moving part is a function of the frame. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#c08a00"/>
    </linearGradient>
    <radialGradient id="goldr" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.6" stop-color="#e0b030"/>
      <stop offset="1" stop-color="#8a6000"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#ff8a1e"/>
      <stop offset="1" stop-color="#8a2000"/>
    </radialGradient>
    <radialGradient id="shell" cx="12.5" cy="12" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a8ca6"/>
      <stop offset="0.5" stop-color="#2f4b62"/>
      <stop offset="1" stop-color="#152431"/>
    </radialGradient>
  </defs>
  <!-- Layer one: the outer projector frame, heavier than the Shielded's. -->
  <polygon points="16,1.9 28.21,8.95 28.21,23.05 16,30.1 3.79,23.05 3.79,8.95" fill="#9fd0ea" fill-opacity="0.16" stroke="#000000" stroke-width="2.6" stroke-linejoin="round"/>
  <polygon points="16,1.9 28.21,8.95 28.21,23.05 16,30.1 3.79,23.05 3.79,8.95" fill="none" stroke="#5d86a3" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- Layer two: an inner frame that turns 60 degrees a loop. -->
  <polygon points="27.72,14.65 23.02,25.48 11.3,26.82 4.28,17.35 8.98,6.53 20.7,5.17" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="27.72,14.65 23.02,25.48 11.3,26.82 4.28,17.35 8.98,6.53 20.7,5.17" fill="none" stroke="#4a7392" stroke-width="0.8" stroke-linejoin="round"/>
  <g fill="#2f4b62" stroke="#000000" stroke-width="0.4">
    <circle cx="27.72" cy="14.65" r="0.7"/>
    <circle cx="23.02" cy="25.48" r="0.7"/>
    <circle cx="11.3" cy="26.82" r="0.7"/>
    <circle cx="4.28" cy="17.35" r="0.7"/>
    <circle cx="8.98" cy="6.53" r="0.7"/>
    <circle cx="20.7" cy="5.17" r="0.7"/>
  </g>
  <!-- Layer three: a dashed energy ring running the other way. -->
  <circle cx="16" cy="16" r="9.9" fill="none" stroke="#8fbcd6" stroke-width="0.9" stroke-dasharray="2.07 1.38" stroke-dashoffset="-9.23" opacity="0.75"/>
  <!-- Emitter nodes on every vertex; a charge chases round them once a loop. -->
  <circle cx="16" cy="1.9" r="1.55" fill="#2f4b62" stroke="#000000" stroke-width="0.6"/>
  <circle cx="16" cy="1.9" r="0.54" fill="#6e94ae"/>
  <circle cx="28.21" cy="8.95" r="1.55" fill="#2f4b62" stroke="#000000" stroke-width="0.6"/>
  <circle cx="28.21" cy="8.95" r="0.45" fill="#5d86a3"/>
  <circle cx="28.21" cy="23.05" r="1.55" fill="#2f4b62" stroke="#000000" stroke-width="0.6"/>
  <circle cx="28.21" cy="23.05" r="0.45" fill="#5d86a3"/>
  <circle cx="16" cy="30.1" r="1.55" fill="#2f4b62" stroke="#000000" stroke-width="0.6"/>
  <circle cx="16" cy="30.1" r="0.45" fill="#5d86a3"/>
  <circle cx="3.79" cy="23.05" r="1.55" fill="#2f4b62" stroke="#000000" stroke-width="0.6"/>
  <circle cx="3.79" cy="23.05" r="0.45" fill="#5d86a3"/>
  <circle cx="3.79" cy="8.95" r="1.55" fill="#2f4b62" stroke="#000000" stroke-width="0.6"/>
  <circle cx="3.79" cy="8.95" r="1.06" fill="#ccdfee"/>
  <!-- The core. -->
  <circle cx="16" cy="16" r="8.8" fill="url(#shell)" stroke="#000000" stroke-width="1.1"/>
  <path d="M8.56 14.01 A7.7 7.7 0 0 1 14.01 8.56" fill="none" stroke="#a9c4d6" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- A grille for a mouth. -->
  <g fill="#0a141c">
    <rect x="13.2" y="19.6" width="1.2" height="2.4" rx="0.5"/>
    <rect x="15.4" y="19.6" width="1.2" height="2.4" rx="0.5"/>
    <rect x="17.6" y="19.6" width="1.2" height="2.4" rx="0.5"/>
  </g>
  <!-- The visor, with two ember eyes that sweep it twice a loop. -->
  <rect x="9.8" y="13.4" width="12.4" height="4.6" rx="2" fill="#0a141c" stroke="#000000" stroke-width="0.6"/>
  <circle cx="14.45" cy="15.9" r="1.25" fill="url(#ember)"/>
  <circle cx="20.45" cy="15.9" r="1.25" fill="url(#ember)"/>
  <!-- The brow plate cuts a V into the visor. -->
  <path d="M9.2 11.2 L16 12.8 L22.8 11.2 L22.8 12.6 L16 14.4 L9.2 12.6 Z" fill="#152431" stroke="#000000" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M12.3 8 V4.72 L14.37 6.28 L16 4 L17.63 6.28 L19.7 4.72 V8 Z" fill="url(#gold)" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <line x1="12.8" y1="7" x2="19.2" y2="7" stroke="#a07000" stroke-width="0.6"/>
  <circle cx="16" cy="6.1" r="0.7" fill="#c02000" stroke="#000000" stroke-width="0.3"/>
</svg>
