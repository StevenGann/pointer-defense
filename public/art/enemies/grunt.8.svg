<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shell" cx="11" cy="10" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f93ad"/>
      <stop offset="0.45" stop-color="#35506a"/>
      <stop offset="1" stop-color="#1b2c3b"/>
    </radialGradient>
    <radialGradient id="iris" cx="15.2" cy="15.2" r="4.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="0.55" stop-color="#8fc0e0"/>
      <stop offset="1" stop-color="#3f7399"/>
    </radialGradient>
  </defs>
  <!-- Shell: a domed body lit from the top-left, like every bevel in the game. -->
  <circle cx="16" cy="16" r="13.5" fill="url(#shell)" stroke="#000000" stroke-width="1"/>
  <!-- Rim light and rim shadow, just inside the outline. -->
  <path d="M4.18 13.92 A12 12 0 0 1 13.92 4.18" fill="none" stroke="#a9c4d6" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <path d="M27.82 18.08 A12 12 0 0 1 18.08 27.82" fill="none" stroke="#0e1a24" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <!-- Three carapace seams. Three-fold symmetry, so the body has no front and needs no rotation. -->
  <g stroke="#0e1a24" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <line x1="16" y1="22.2" x2="16" y2="28.6"/>
    <line x1="10.63" y1="12.9" x2="5.09" y2="9.7"/>
    <line x1="21.37" y1="12.9" x2="26.91" y2="9.7"/>
  </g>
  <!-- A panel line round the eye housing, and a bolt in each of the three shell plates. -->
  <circle cx="16" cy="16" r="8.4" fill="none" stroke="#0e1a24" stroke-width="0.7" opacity="0.45"/>
  <path d="M9.3 11.6 A8 8 0 0 1 12.4 8.9" fill="none" stroke="#a9c4d6" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
  <circle cx="16" cy="5.4" r="0.8" fill="#0e1a24"/><circle cx="15.76" cy="5.16" r="0.32" fill="#a9c4d6" opacity="0.8"/><circle cx="25.2" cy="21.3" r="0.8" fill="#0e1a24"/><circle cx="24.96" cy="21.06" r="0.32" fill="#a9c4d6" opacity="0.8"/><circle cx="6.8" cy="21.3" r="0.8" fill="#0e1a24"/><circle cx="6.56" cy="21.06" r="0.32" fill="#a9c4d6" opacity="0.8"/>
  <!-- Walk frame 8 of 16: the dome sways on a sine, left then right; the eye rides it and the pupil leads. -->
  <g transform="translate(0 0)">
    <circle cx="16" cy="16" r="5.8" fill="#0e1a24"/>
    <circle cx="16" cy="16" r="4.4" fill="url(#iris)"/><circle cx="16" cy="16" r="3.2" fill="none" stroke="#2a5878" stroke-width="0.5"/>
    <circle cx="16" cy="16" r="2" fill="#000000"/>
    <circle cx="14.4" cy="14.3" r="0.6" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
