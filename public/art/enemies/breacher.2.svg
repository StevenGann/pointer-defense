<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Roll frame 2 of 12: the grousers have moved 0.5 units forward. The pattern repeats every 3 units, so a new grouser comes over the rear sprocket as one leaves the front. -->
  <defs>
    <linearGradient id="hull" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ab0bf"/>
      <stop offset="0.5" stop-color="#5a7183"/>
      <stop offset="1" stop-color="#33444f"/>
    </linearGradient>
  </defs>
  <!-- Two treads, one on each flank. Faces +x. -->
  <g fill="#1b2630" stroke="#000000" stroke-width="0.8">
    <rect x="7.5" y="3.6" width="15" height="3.6" rx="1.2"/>
    <rect x="7.5" y="24.8" width="15" height="3.6" rx="1.2"/>
  </g>
  <g stroke="#5a6b78" stroke-width="0.8">
    <line x1="11" y1="4.2" x2="11" y2="6"/><line x1="14" y1="4.2" x2="14" y2="6"/>
    <line x1="17" y1="4.2" x2="17" y2="6"/><line x1="20" y1="4.2" x2="20" y2="6"/>
    <line x1="11" y1="26" x2="11" y2="27.8"/><line x1="14" y1="26" x2="14" y2="27.8"/>
    <line x1="17" y1="26" x2="17" y2="27.8"/><line x1="20" y1="26" x2="20" y2="27.8"/>
  </g>
  <!-- The hull. -->
  <rect x="6" y="6" width="20" height="20" rx="4.5" fill="url(#hull)" stroke="#000000" stroke-width="2"/>
  <path d="M8.2 12 V10.4 Q8.2 8.2 10.4 8.2 H17" fill="none" stroke="#d2e0ea" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- A riveted seam across the back of the hull. -->
  <path d="M14.6 7.4 V10.6 M14.6 21.4 V24.6" stroke="#1b2630" stroke-width="0.7" opacity="0.7"/>
  <circle cx="9.2" cy="10.4" r="0.75" fill="#1b2630"/><circle cx="8.97" cy="10.18" r="0.3" fill="#d2e0ea" opacity="0.8"/><circle cx="9.2" cy="21.6" r="0.75" fill="#1b2630"/><circle cx="8.97" cy="21.38" r="0.3" fill="#d2e0ea" opacity="0.8"/>
  <!-- The jaw: an open wedge in the leading edge, with teeth on both sides. -->
  <polygon points="27,9.8 14.5,16 27,22.2" fill="#070b0f" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <g fill="#c2ced6" stroke="#000000" stroke-width="0.5" stroke-linejoin="round">
    <polygon points="25.4,10.9 23,12.1 24,14.2"/>
    <polygon points="22.2,12.5 19.8,13.7 20.8,15.5"/>
    <polygon points="25.4,21.1 23,19.9 24,17.8"/>
    <polygon points="22.2,19.5 19.8,18.3 20.8,16.5"/>
  </g>
  <!-- The mounted turret at the back. -->
  <circle cx="10.6" cy="16" r="2.9" fill="#26333d" stroke="#000000" stroke-width="0.8"/>
  <rect x="10.6" y="15.2" width="4.2" height="1.6" fill="#26333d" stroke="#000000" stroke-width="0.6"/>
  <circle cx="10" cy="15.4" r="0.8" fill="#9ab0bf"/>
  <!-- Two eyes, one each side of the jaw. -->
  <circle cx="19.6" cy="9.6" r="1.4" fill="#bfe6ff" stroke="#0e1a24" stroke-width="1"/>
  <circle cx="19.6" cy="22.4" r="1.4" fill="#bfe6ff" stroke="#0e1a24" stroke-width="1"/>
  <circle cx="20.1" cy="9.8" r="0.7" fill="#000000"/>
  <circle cx="20.1" cy="22.2" r="0.7" fill="#000000"/>
</svg>
