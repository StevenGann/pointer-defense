<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="plate" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c9cba"/>
      <stop offset="0.5" stop-color="#406080"/>
      <stop offset="1" stop-color="#22364a"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8a8f94"/>
    </radialGradient>
  </defs>
  <!-- The outer plate, with the heavy 2 px outline that marks armour. -->
  <rect x="3" y="3" width="26" height="26" fill="url(#plate)" stroke="#000000" stroke-width="2"/>
  <!-- Walk frame 3 of 6, the footfall held, the same pose as frame 2. -->
  <rect x="8.5" y="8.5" width="15" height="15" fill="#406080"/>
  <path d="M8.5 23.5 V8.5 H23.5" fill="none" stroke="#162636" stroke-width="1"/>
  <path d="M23.5 8.5 V23.5 H8.5" fill="none" stroke="#9db9d1" stroke-width="1"/>
  <!-- Weld seams from the inner plate to each rivet. -->
  <g stroke="#162636" stroke-width="0.8" opacity="0.6">
    <line x1="8.5" y1="8.5" x2="6.8" y2="6.8"/>
    <line x1="23.5" y1="8.5" x2="25.2" y2="6.8"/>
    <line x1="8.5" y1="23.5" x2="6.8" y2="25.2"/>
    <line x1="23.5" y1="23.5" x2="25.2" y2="25.2"/>
  </g>
  <!-- Four corner rivets. -->
  <g fill="url(#rivet)" stroke="#000000" stroke-width="0.6">
    <circle cx="6.2" cy="6.2" r="1.9"/>
    <circle cx="25.8" cy="6.2" r="1.9"/>
    <circle cx="6.2" cy="25.8" r="1.9"/>
    <circle cx="25.8" cy="25.8" r="1.9"/>
  </g>
  <!-- A view slit with two eyes in the dark. -->
  <g transform="translate(1 1)">
    <rect x="10.5" y="13.6" width="11" height="4.2" rx="0.8" fill="#070d12" stroke="#000000" stroke-width="0.6"/>
    <rect x="12.4" y="15.3" width="2.6" height="0.9" fill="#bfe6ff"/>
    <rect x="17" y="15.3" width="2.6" height="0.9" fill="#bfe6ff"/>
  </g>
</svg>
