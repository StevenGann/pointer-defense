<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="3.4" cy="16" r="3.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd24a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- A diamond cut into four facets. Faces +x; the fuse burns at the rear corner. -->
  <polygon points="3,16 16,3 16,16" fill="#7590a6"/>
  <polygon points="16,3 29,16 16,16" fill="#5c768c"/>
  <polygon points="3,16 16,29 16,16" fill="#3b5064"/>
  <polygon points="16,29 29,16 16,16" fill="#2a3c4d"/>
  <polygon points="16,8 24,16 16,24 8,16" fill="none" stroke="#c4d6e2" stroke-width="0.8" opacity="0.35"/>
  <polygon points="16,3 29,16 16,29 3,16" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <!-- Ridge lines where the facets meet. -->
  <path d="M3.8 16 H8.6 M16 3.8 V7.6 M16 24.4 V28.2" stroke="#16242f" stroke-width="0.6" opacity="0.5"/>
  <!-- The charge it carries, strapped down. -->
  <path d="M13.2 11.6 V20.4" stroke="#000000" stroke-width="2.2"/>
  <path d="M13.2 11.6 V20.4" stroke="#4a637a" stroke-width="1"/>
  <circle cx="13.2" cy="16" r="3.1" fill="#121c25" stroke="#000000" stroke-width="0.6"/>
  <circle cx="13.2" cy="16" r="1.5" fill="#ffb020"/>
  <circle cx="12.7" cy="15.5" r="0.5" fill="#fff3c4"/>
  <!-- Two narrow eyes. -->
  <g stroke="#ffcf5a" stroke-width="1.3" stroke-linecap="round">
    <line x1="20" y1="12.8" x2="23.4" y2="14.3"/>
    <line x1="20" y1="19.2" x2="23.4" y2="17.7"/>
  </g>
  <!-- Fuse frame 3 of 6: the spark kinks downward. -->
  <circle cx="3.4" cy="16" r="3" fill="url(#glow)"/>
  <g stroke="#806000" stroke-width="1.2" stroke-linecap="round">
    <line x1="3" y1="16" x2="1.23" y2="15.69"/>
    <line x1="3" y1="16" x2="1.28" y2="17.2"/>
    <line x1="3" y1="16" x2="2.45" y2="14.5"/>
  </g>
  <circle cx="2.6" cy="16" r="1.2" fill="#fff3c4"/>
</svg>
