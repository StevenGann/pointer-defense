<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ram (breacher-boss), frame 2 of 48. Generated: every moving part is a function of the frame. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#c08a00"/>
    </linearGradient>
    <radialGradient id="goldr" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.6" stop-color="#e0b030"/>
      <stop offset="1" stop-color="#8a6000"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#ff8a1e"/>
      <stop offset="1" stop-color="#8a2000"/>
    </radialGradient>
    <linearGradient id="hull" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ab0bf"/>
      <stop offset="0.5" stop-color="#5a7183"/>
      <stop offset="1" stop-color="#33444f"/>
    </linearGradient>
    <linearGradient id="drill" x1="0" y1="11.2" x2="0" y2="20.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3ebf0"/>
      <stop offset="0.45" stop-color="#8fa3b1"/>
      <stop offset="1" stop-color="#33444f"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#7d93a3"/>
      <stop offset="1" stop-color="#1b2630"/>
    </radialGradient>
    <clipPath id="treads">
      <rect x="8.4" y="5.8" width="15.2" height="4.2" rx="1.2"/>
      <rect x="8.4" y="22" width="15.2" height="4.2" rx="1.2"/>
    </clipPath>
    <clipPath id="cone">
      <polygon points="24.2,11.2 30.7,16 24.2,20.8"/>
    </clipPath>
  </defs>
  <!-- Wide treads on both flanks, rolling forward. Faces +x. -->
  <g fill="#1b2630" stroke="#000000" stroke-width="0.9">
    <rect x="8" y="5.4" width="16" height="5" rx="1.6"/>
    <rect x="8" y="21.6" width="16" height="5" rx="1.6"/>
  </g>
  <g clip-path="url(#treads)">
    <g fill="#5a6b78">
      <rect x="7.42" y="5.9" width="1.1" height="1.7"/>
      <rect x="7.42" y="24.4" width="1.1" height="1.7"/>
      <rect x="9.92" y="5.9" width="1.1" height="1.7"/>
      <rect x="9.92" y="24.4" width="1.1" height="1.7"/>
      <rect x="12.42" y="5.9" width="1.1" height="1.7"/>
      <rect x="12.42" y="24.4" width="1.1" height="1.7"/>
      <rect x="14.92" y="5.9" width="1.1" height="1.7"/>
      <rect x="14.92" y="24.4" width="1.1" height="1.7"/>
      <rect x="17.42" y="5.9" width="1.1" height="1.7"/>
      <rect x="17.42" y="24.4" width="1.1" height="1.7"/>
      <rect x="19.92" y="5.9" width="1.1" height="1.7"/>
      <rect x="19.92" y="24.4" width="1.1" height="1.7"/>
      <rect x="22.42" y="5.9" width="1.1" height="1.7"/>
      <rect x="22.42" y="24.4" width="1.1" height="1.7"/>
      <rect x="24.92" y="5.9" width="1.1" height="1.7"/>
      <rect x="24.92" y="24.4" width="1.1" height="1.7"/>
    </g>
  </g>
  <!-- The hull: smaller than the Breacher's, because the drill takes the front. -->
  <rect x="8.5" y="8.5" width="15" height="15" rx="3.2" fill="url(#hull)" stroke="#000000" stroke-width="2"/>
  <path d="M10.3 13.4 V11.6 Q10.3 10.3 11.6 10.3 H17" fill="none" stroke="#d2e0ea" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <g fill="#26333d">
    <circle cx="15.4" cy="10.5" r="0.55"/><circle cx="18.6" cy="10.5" r="0.55"/>
    <circle cx="15.4" cy="21.5" r="0.55"/><circle cx="18.6" cy="21.5" r="0.55"/>
  </g>
  <!-- Exhaust stacks at the rear. -->
  <g fill="#0b0f12" stroke="#5a6b78" stroke-width="0.6">
    <circle cx="9.8" cy="11.2" r="1.1"/>
    <circle cx="9.8" cy="20.8" r="1.1"/>
  </g>
  <!-- The drill mount, with the Breacher's teeth on either side. -->
  <rect x="21.4" y="10.4" width="3" height="11.2" rx="0.8" fill="#33444f" stroke="#000000" stroke-width="0.8"/>
  <g fill="#9ab0bf">
    <circle cx="22.9" cy="11.6" r="0.55"/>
    <circle cx="22.9" cy="20.4" r="0.55"/>
  </g>
  <!-- The drill: a steel cone whose helical flutes run back toward the hull as it spins. -->
  <polygon points="24.2,11.2 30.7,16 24.2,20.8" fill="url(#drill)"/>
  <g clip-path="url(#cone)">
    <g stroke="#1b2630" stroke-width="0.9" opacity="0.75">
      <line x1="21.87" y1="10.8" x2="24.27" y2="21.2"/>
      <line x1="23.87" y1="10.8" x2="26.27" y2="21.2"/>
      <line x1="25.87" y1="10.8" x2="28.27" y2="21.2"/>
      <line x1="27.87" y1="10.8" x2="30.27" y2="21.2"/>
      <line x1="29.87" y1="10.8" x2="32.27" y2="21.2"/>
      <line x1="31.87" y1="10.8" x2="34.27" y2="21.2"/>
    </g>
    <g stroke="#ffffff" stroke-width="0.4" opacity="0.45">
      <line x1="22.42" y1="10.8" x2="24.82" y2="21.2"/>
      <line x1="24.42" y1="10.8" x2="26.82" y2="21.2"/>
      <line x1="26.42" y1="10.8" x2="28.82" y2="21.2"/>
      <line x1="28.42" y1="10.8" x2="30.82" y2="21.2"/>
      <line x1="30.42" y1="10.8" x2="32.82" y2="21.2"/>
      <line x1="32.42" y1="10.8" x2="34.82" y2="21.2"/>
    </g>
  </g>
  <polygon points="24.2,11.2 30.7,16 24.2,20.8" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#000000" stroke-width="0.5" stroke-linejoin="round">
    <polygon points="24,10.4 26.6,11.4 24,12.2"/>
    <polygon points="24,21.6 26.6,20.6 24,19.8"/>
  </g>
  <!-- Two ember eyes on the front corners, under hard brows. -->
  <circle cx="20.4" cy="11" r="1.35" fill="url(#ember)" stroke="#000000" stroke-width="0.5"/>
  <circle cx="20.4" cy="21" r="1.35" fill="url(#ember)" stroke="#000000" stroke-width="0.5"/>
  <ellipse cx="20.7" cy="11" rx="0.35" ry="0.9" fill="#000000"/>
  <ellipse cx="20.7" cy="21" rx="0.35" ry="0.9" fill="#000000"/>
  <g stroke="#000000" stroke-width="0.9" stroke-linecap="round">
    <line x1="18.8" y1="9.6" x2="21.8" y2="10.4"/>
    <line x1="18.8" y1="22.4" x2="21.8" y2="21.6"/>
  </g>
  <!-- The crowned turret: twin barrels that sweep once a loop. -->
  <circle cx="13.2" cy="16" r="3.6" fill="#26333d" stroke="#000000" stroke-width="0.8"/>
  <g transform="rotate(4.66 13.2 16)">
  <g fill="url(#goldr)" stroke="#000000" stroke-width="0.5" stroke-linejoin="round">
    <polygon points="12.29,12.83 13.2,11.1 14.11,12.83"/>
    <polygon points="15.94,14.15 17.86,14.49 16.5,15.88"/>
    <polygon points="15.8,18.03 16.08,19.96 14.33,19.1"/>
    <polygon points="12.07,19.1 10.32,19.96 10.6,18.03"/>
    <polygon points="9.9,15.88 8.54,14.49 10.46,14.15"/>
  </g>
    <g fill="#26333d" stroke="#000000" stroke-width="0.5">
      <rect x="14.6" y="14.5" width="6" height="1.1"/>
      <rect x="14.6" y="16.4" width="6" height="1.1"/>
    </g>
    <circle cx="13.2" cy="16" r="2.6" fill="url(#dome)" stroke="#000000" stroke-width="0.7"/>
    <circle cx="13.2" cy="16" r="0.9" fill="#c02000" stroke="#000000" stroke-width="0.3"/>
  </g>
  <!-- Exhaust smoke: two puffs leave each stack a loop. -->
  <g fill="#3a444c">
    <circle cx="9.22" cy="11.1" r="1.03" opacity="0.55"/>
    <circle cx="5.72" cy="10.5" r="1.83" opacity="0.25"/>
    <circle cx="9.22" cy="20.9" r="1.03" opacity="0.55"/>
    <circle cx="5.72" cy="21.5" r="1.83" opacity="0.25"/>
  </g>
</svg>
