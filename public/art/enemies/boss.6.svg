<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="shell" cx="12" cy="11" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5f8aa3"/>
      <stop offset="0.5" stop-color="#27495d"/>
      <stop offset="1" stop-color="#0f212c"/>
    </radialGradient>
    <radialGradient id="iris" cx="15.4" cy="16" r="4.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#ff8a1e"/>
      <stop offset="1" stop-color="#8a2000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0.8" x2="0" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#c08a00"/>
    </linearGradient>
  </defs>
  <!-- The segmented outer rim: eight armour plates. -->
  <!-- Walk frame 6 of 9: the rim has ground 30 degrees clockwise; the next frame 0 completes one plate. -->
  <circle cx="16" cy="16" r="13.4" fill="none" stroke="#000000" stroke-width="3.2" stroke-dasharray="8.72 1.8" stroke-dashoffset="3.87"/>
  <circle cx="16" cy="16" r="13.4" fill="none" stroke="#4f7890" stroke-width="1.8" stroke-dasharray="8 2.52" stroke-dashoffset="3.51"/>
  <!-- The body. -->
  <circle cx="16" cy="16" r="10.8" fill="url(#shell)" stroke="#000000" stroke-width="1.5"/>
  <path d="M7 13.6 A9.3 9.3 0 0 1 13.6 7" fill="none" stroke="#a9c9da" stroke-width="1" stroke-linecap="round" opacity="0.65"/>
  <!-- One large eye with a slit pupil. -->
  <circle cx="16" cy="16.8" r="5.4" fill="#060c11"/>
  <circle cx="16" cy="16.8" r="4.3" fill="url(#iris)"/>
  <ellipse cx="16" cy="16.8" rx="1.1" ry="3.5" fill="#000000"/>
  <circle cx="14.2" cy="15.2" r="0.9" fill="#ffffff"/>
  <!-- A heavy brow over the eye. -->
  <path d="M9.8 10.6 H22.2 V12.6 L16 15.4 L9.8 12.6 Z" fill="#1b3847" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- The crown. -->
  <path d="M11.4 6 V1.8 L14 3.8 L16 0.9 L18 3.8 L20.6 1.8 V6 Z" fill="url(#gold)" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <circle cx="16" cy="4.6" r="0.75" fill="#c02000"/>
</svg>
