<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Flap frame 9 of 11: the wings are drawn at 41% of their spread, folding on a cosine. Pingpong plays 0..10..1. -->
  <defs>
    <radialGradient id="body" cx="15" cy="13" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b3c8d6"/>
      <stop offset="0.55" stop-color="#6b8598"/>
      <stop offset="1" stop-color="#3a5061"/>
    </radialGradient>
    <linearGradient id="wing" x1="3" y1="0" x2="17" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9dae5"/>
      <stop offset="1" stop-color="#7d97a9"/>
    </linearGradient>
  </defs>
  <!-- Two swept wings with ribs. Faces +x. -->
  <path d="M17 11.61 L3 8.09 Q6.5 10.16 5.5 12.32 L12 12.48 Z" fill="url(#wing)" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M17 20.39 L3 23.91 Q6.5 21.84 5.5 19.68 L12 19.52 Z" fill="url(#wing)" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <g stroke="#2c3e4d" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
    <line x1="14" y1="11.74" x2="6.2" y2="9.58"/>
    <line x1="12.5" y1="12.07" x2="6.4" y2="10.99"/>
    <line x1="14" y1="20.26" x2="6.2" y2="22.42"/>
    <line x1="12.5" y1="19.93" x2="6.4" y2="21.01"/>
  </g>
  <!-- Body, with a short tail. -->
  <path d="M10.5 14.6 L7 16 L10.5 17.4 Z" fill="#3a5061" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <ellipse cx="17.5" cy="16" rx="7.5" ry="6.2" fill="url(#body)" stroke="#000000" stroke-width="1"/>
  <path d="M12 13.4 Q14.5 10.9 18 10.8" fill="none" stroke="#e4eef4" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
  <!-- Two plate seams across the body. -->
  <path d="M14.6 10.6 Q12.9 16 14.6 21.4 M18.4 10 Q17 16 18.4 22" fill="none" stroke="#1c2a36" stroke-width="0.7" opacity="0.5"/>
  <!-- Two eyes on the leading side. -->
  <circle cx="21.4" cy="13.5" r="1.7" fill="#0e1a24"/>
  <circle cx="21.4" cy="18.5" r="1.7" fill="#0e1a24"/>
  <circle cx="21.6" cy="13.5" r="1.1" fill="#bfe6ff"/>
  <circle cx="21.6" cy="18.5" r="1.1" fill="#bfe6ff"/>
  <circle cx="22" cy="13.6" r="0.65" fill="#000000"/>
  <circle cx="22" cy="18.4" r="0.65" fill="#000000"/>
</svg>
