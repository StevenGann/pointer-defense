<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="body" x1="0" y1="9" x2="0" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9dbccd"/>
      <stop offset="0.5" stop-color="#577489"/>
      <stop offset="1" stop-color="#2b4052"/>
    </linearGradient>
  </defs>
  <!-- Speed streaks trail behind the tail. Faces +x. -->
  <g stroke="#f2f7fa" stroke-width="1" stroke-linecap="round">
    <line x1="3.2" y1="11.5" x2="0.6" y2="11.5" opacity="0.85"/>
    <line x1="6.4" y1="16" x2="0.6" y2="16" opacity="0.6"/>
    <line x1="3.2" y1="20.5" x2="0.6" y2="20.5" opacity="0.85"/>
  </g>
  <!-- A dart with a notched tail. -->
  <path d="M30 16 L9 9.5 L4 10.5 L8 16 L4 21.5 L9 22.5 Z" fill="url(#body)" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <!-- Spine and a top-edge highlight. -->
  <line x1="9" y1="16" x2="18.5" y2="16" stroke="#16242f" stroke-width="1" opacity="0.55" stroke-linecap="round"/>
  <line x1="10" y1="11.4" x2="23" y2="15" stroke="#d6e6ef" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <!-- One eye, looking where it runs. -->
  <circle cx="21.2" cy="16" r="2" fill="#0e1a24"/>
  <circle cx="21.4" cy="16" r="1.4" fill="#e6f4ff"/>
  <circle cx="21.9" cy="16" r="0.7" fill="#000000"/>
</svg>
