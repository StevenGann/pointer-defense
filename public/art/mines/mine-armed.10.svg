<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A live mine: a spiked steel ball with a red lamp. Frame 10 of 12: the lamp breathes on a
       cosine (dark, lit, a flare with a halo over the ball, and back); the body does not move. -->
  <defs>
    <radialGradient id="ball" cx="12.6" cy="12.2" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8a8a8"/>
      <stop offset="0.45" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </radialGradient>
  </defs>
  <g stroke="#000000" stroke-width="3.4" stroke-linecap="round">
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(0 16 16)"/>
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(45 16 16)"/>
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(90 16 16)"/>
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(135 16 16)"/>
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(180 16 16)"/>
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(225 16 16)"/>
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(270 16 16)"/>
    <line x1="16" y1="9" x2="16" y2="4.4" transform="rotate(315 16 16)"/>
  </g>
  <g fill="#b4b4b4"><circle cx="16" cy="4.6" r="1.1" transform="rotate(0 16 16)"/><circle cx="16" cy="4.6" r="1.1" transform="rotate(45 16 16)"/><circle cx="16" cy="4.6" r="1.1" transform="rotate(90 16 16)"/><circle cx="16" cy="4.6" r="1.1" transform="rotate(135 16 16)"/><circle cx="16" cy="4.6" r="1.1" transform="rotate(180 16 16)"/><circle cx="16" cy="4.6" r="1.1" transform="rotate(225 16 16)"/><circle cx="16" cy="4.6" r="1.1" transform="rotate(270 16 16)"/><circle cx="16" cy="4.6" r="1.1" transform="rotate(315 16 16)"/></g>
  <circle cx="16" cy="16" r="8.2" fill="url(#ball)" stroke="#000000" stroke-width="1.6"/>
  <path d="M9.9 13.6 A6.6 6.6 0 0 1 13.6 9.9" fill="none" stroke="#e0e0e0" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  <circle cx="16" cy="16" r="4.4" fill="#000000"/>
  <circle cx="16" cy="16" r="3.3" fill="#da2222"/>
  <circle cx="14.9" cy="14.9" r="1.1" fill="#ffffff" opacity="0.85"/>
</svg>
