  <g stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round">
    <line x1="16" y1="8.5" x2="16" y2="3"/>
    <line x1="16" y1="23.5" x2="16" y2="29"/>
    <line x1="8.5" y1="16" x2="3" y2="16"/>
    <line x1="23.5" y1="16" x2="29" y2="16"/>
    <line x1="10.7" y1="10.7" x2="6.8" y2="6.8"/>
    <line x1="21.3" y1="21.3" x2="25.2" y2="25.2"/>
    <line x1="21.3" y1="10.7" x2="25.2" y2="6.8"/>
    <line x1="10.7" y1="21.3" x2="6.8" y2="25.2"/>
