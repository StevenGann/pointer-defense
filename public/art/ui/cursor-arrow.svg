<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The game's pointer, also used as the OS cursor: the classic arrow with its tip on the
     top-left origin (the hotspot). Mitred corners and a hard black edge, as the period drew it.
     The fill is white so the engine can tint it. -->
  <polygon points="0,0 0,25 6,19.5 10.5,30.5 15,28.6 10.6,18 19,18" fill="#000000"/>
  <polygon points="1.8,4.3 1.8,21 5.5,17.6 6.8,17 11.4,28.2 12.7,27.6 8,16.2 14.6,16.2" fill="#ffffff"/>
</svg>
