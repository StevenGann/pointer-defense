<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
  <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bcbcbc"/>
    <stop offset="1" stop-color="#8c8c8c"/>
  </linearGradient>
  </defs>
  <!-- A closed gate leaf: a roller shutter filling the tile. Five slats, each lit on its top edge
     and shaded on its bottom, a heavy sill with a lift handle, and a dark frame. For the moment
     it is shut it is a wall, and it looks like one. -->
  <rect x="0" y="0" width="32" height="32" fill="#404040"/>
  <rect x="1" y="1" width="30" height="5" fill="url(#slat)"/><rect x="1" y="1" width="30" height="1" fill="#e4e4e4"/><rect x="1" y="5" width="30" height="1" fill="#5c5c5c"/>
  <rect x="1" y="6" width="30" height="5" fill="url(#slat)"/><rect x="1" y="6" width="30" height="1" fill="#e4e4e4"/><rect x="1" y="10" width="30" height="1" fill="#5c5c5c"/>
  <rect x="1" y="11" width="30" height="5" fill="url(#slat)"/><rect x="1" y="11" width="30" height="1" fill="#e4e4e4"/><rect x="1" y="15" width="30" height="1" fill="#5c5c5c"/>
  <rect x="1" y="16" width="30" height="5" fill="url(#slat)"/><rect x="1" y="16" width="30" height="1" fill="#e4e4e4"/><rect x="1" y="20" width="30" height="1" fill="#5c5c5c"/>
  <rect x="1" y="21" width="30" height="5" fill="url(#slat)"/><rect x="1" y="21" width="30" height="1" fill="#e4e4e4"/><rect x="1" y="25" width="30" height="1" fill="#5c5c5c"/>
  <!-- The sill and its handle. -->
  <rect x="1" y="26" width="30" height="5" fill="#787878"/>
  <rect x="1" y="26" width="30" height="1" fill="#d0d0d0"/>
  <rect x="12" y="27.5" width="8" height="2" fill="#303030"/>
  <rect x="12" y="27.5" width="8" height="1" fill="#101010"/>
  <!-- Guide rails. -->
  <rect x="1" y="1" width="2" height="30" fill="#606060"/><rect x="29" y="1" width="2" height="30" fill="#505050"/>
  <rect x="1" y="1" width="1" height="30" fill="#a8a8a8"/>
</svg>
