<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 24">
  <defs>
  <linearGradient id="fade" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.2" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="0.8" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  </defs>
  <!-- Synergy link (spotter): the one-way gift drawn from a Marksman to the tower it lends range
     to. Same contract as synergy-link.svg (horizontal, white, tinted, middle band visible), but
     it differs by SHAPE, not only colour: no coupling block, just two thin rails and three
     chevrons marching toward +x, the receiver. The engine mirrors the sprite when the giver sits
     east or south, so the chevrons always point from giver to receiver. -->
  <rect x="0" y="5" width="64" height="2" fill="url(#fade)" opacity="0.8"/>
  <rect x="0" y="17" width="64" height="2" fill="url(#fade)" opacity="0.8"/>
  <g fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="miter">
  <path d="M20.5 4.5 H24.5 L30.5 12 L24.5 19.5 H20.5 L26.5 12 Z"/>
  <path d="M28.5 4.5 H32.5 L38.5 12 L32.5 19.5 H28.5 L34.5 12 Z"/>
  <path d="M36.5 4.5 H40.5 L46.5 12 L40.5 19.5 H36.5 L42.5 12 Z"/>
  </g>
</svg>
