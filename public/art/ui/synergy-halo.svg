<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Synergy halo: drawn UNDER a tower base for every tower in a synergy cluster, at about 1.6
     cells across, and tinted with the synergy's colour. Keep it white: the tint is the colour.
  
     It is a docking pad, not a ring, so it cannot be taken for a range circle. The tower's own
     base covers the middle (about 12..52 of this 64 box); what shows is a square floor tint just
     outside the base, a solid bracket on each corner, and a coupling tab on each side that meets
     the neighbour's tab. Black survives the tint, so the brackets carry a thin dark edge. -->
  <rect x="7" y="7" width="50" height="50" fill="#ffffff" opacity="0.2"/>
  <rect x="9.5" y="9.5" width="45" height="45" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" stroke-dasharray="3 3"/>
  <!-- Corner brackets. -->
  <g fill="#ffffff" stroke="#000000" stroke-width="0.8" stroke-opacity="0.55" stroke-linejoin="miter" opacity="0.9">
  <path d="M5 5 H18 V9 H9 V18 H5 Z"/>
  <path d="M59 5 V18 H55 V9 H46 V5 Z"/>
  <path d="M5 59 V46 H9 V55 H18 V59 Z"/>
  <path d="M59 59 H46 V55 H55 V46 H59 Z"/>
  </g>
  <!-- Coupling tabs: one on each side, pointing out at the neighbouring pad. -->
  <g fill="#ffffff" opacity="0.75">
  <path d="M27 5 H37 V2 H27 Z"/><path d="M27 59 H37 V62 H27 Z"/>
  <path d="M5 27 V37 H2 V27 Z"/><path d="M59 27 V37 H62 V27 Z"/>
  </g>
</svg>
