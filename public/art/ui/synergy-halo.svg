<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Synergy halo — drawn UNDER a tower base for every tower in a synergy cluster.

    The artist owns this file. It is rasterised once at the tower's drawn size, tinted with the
    synergy's colour by the engine, and never recoloured in the art: keep it white or pale grey so a
    tint reads as the synergy colour rather than as a filter over an existing colour.

    The engine draws it centred on the tower at about 1.6 cells across; the middle is covered by the
    tower's own base (roughly r=18 of this 64 px box). The ring sits at r=21, just outside the base,
    and is deliberately translucent: it is a hint that two towers are paired, not a range indicator.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="88%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>

  <!-- A soft under-stroke, then a thin ring on top. Both are held back in opacity so the halo reads
       as a tint on the floor rather than as a second range circle. -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="7"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.5"
          stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- Four short ticks at the diagonals, just outside the ring. -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <line x1="46" y1="18" x2="49" y2="15"/>
    <line x1="18" y1="18" x2="15" y2="15"/>
    <line x1="46" y1="46" x2="49" y2="49"/>
    <line x1="18" y1="46" x2="15" y2="49"/>
  </g>
</svg>
