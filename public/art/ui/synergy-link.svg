<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 24">
  <defs>
  <linearGradient id="fade" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.2" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="0.8" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  </defs>
  <!-- Synergy link: the coupling drawn between two adjacent, synergising towers. Drawn horizontal,
     rotated for a north/south pair, tinted with the synergy colour: keep it white. Only the middle
     ~8 px shows between two bases, so everything that matters is in x = 22..42: a bolted coupling
     block, the same from both sides because the two towers are peers. The bus bar fades out at
     the ends, where a base covers it. -->
  <rect x="0" y="8" width="64" height="8" fill="url(#fade)" opacity="0.55"/>
  <rect x="0" y="10.5" width="64" height="3" fill="url(#fade)"/>
  <!-- The coupling block: two flanges and a square collar. -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="miter">
  <rect x="23.5" y="5.5" width="4" height="13"/>
  <rect x="36.5" y="5.5" width="4" height="13"/>
  <rect x="27.5" y="3.5" width="9" height="17"/>
  </g>
  <rect x="30" y="10" width="4" height="4" fill="#000000" opacity="0.7"/>
</svg>
