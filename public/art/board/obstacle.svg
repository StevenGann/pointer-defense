<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="plate" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4b4b4"/>
      <stop offset="1" stop-color="#8c8c8c"/>
    </linearGradient>
  </defs>
  <!-- A blocked tile: a steel plate bolted into a sunk well. -->
  <rect x="0" y="0" width="32" height="32" fill="#a0a0a0"/>
  <path d="M0.5 32 V0.5 H32" fill="none" stroke="#606060" stroke-width="1"/>
  <path d="M31.5 0 V31.5 H0" fill="none" stroke="#d0d0d0" stroke-width="1"/>
  <rect x="3.5" y="3.5" width="25" height="25" fill="url(#plate)" stroke="#707070" stroke-width="1"/>
  <path d="M4.5 27.5 V4.5 H27.5" fill="none" stroke="#d8d8d8" stroke-width="1" opacity="0.8"/>
  <!-- Tread hatch. -->
  <g stroke="#707070" stroke-width="1" opacity="0.45" stroke-linecap="round">
    <line x1="9" y1="15" x2="15" y2="9"/>
    <line x1="9" y1="23" x2="23" y2="9"/>
    <line x1="17" y1="23" x2="23" y2="17"/>
  </g>
  <!-- Four screws. -->
  <g fill="#e0e0e0" stroke="#505050" stroke-width="0.6">
    <circle cx="6.8" cy="6.8" r="1.3"/><circle cx="25.2" cy="6.8" r="1.3"/>
    <circle cx="6.8" cy="25.2" r="1.3"/><circle cx="25.2" cy="25.2" r="1.3"/>
  </g>
</svg>
