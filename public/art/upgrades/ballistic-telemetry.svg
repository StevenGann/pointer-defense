<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Ballistic Telemetry: a plotting sheet with a shell's arc marked point by point and a cross where it lands. -->
  <!-- The frame: a raised Windows 95 button, the same one every achievement icon uses. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <rect x="6" y="7" width="32" height="30" fill="#f4f8f0" stroke="#000000" stroke-width="1.2"/>
  <path d="M6 13 H38 M6 19 H38 M6 25 H38 M6 31 H38 M12 7 V37 M18 7 V37 M24 7 V37 M30 7 V37 M36 7 V37" stroke="#9cc0a8" stroke-width="0.6"/>
  <!-- Axes. -->
  <path d="M9 9 V34 H36" fill="none" stroke="#000080" stroke-width="1.2"/>
  <!-- The arc, then the plotted fixes along it. -->
  <path d="M9 30 Q20 2 34 26" fill="none" stroke="#d00000" stroke-width="1" stroke-dasharray="1.6 1.4"/>
  <g fill="#d00000" stroke="#000000" stroke-width="0.5"><rect x="9.68" y="24.75" width="2.2" height="2.2"/><rect x="13.82" y="17.86" width="2.2" height="2.2"/><rect x="18.16" y="14.33" width="2.2" height="2.2"/><rect x="22.69" y="14.17" width="2.2" height="2.2"/><rect x="27.42" y="17.38" width="2.2" height="2.2"/></g>
  <!-- Impact. -->
  <path d="M31 23 L37 29 M37 23 L31 29" stroke="#000000" stroke-width="3"/>
  <path d="M31 23 L37 29 M37 23 L31 29" stroke="#ffcc00" stroke-width="1.4"/>
</svg>
