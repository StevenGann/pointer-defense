<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Placeholder icon for the system-tray global upgrade (docs/GLOBAL-UPGRADES.md §7.2): the artist
       replaces this file. Never drawn at more than 18 px in the list. -->
  <!-- Raised Win95 tile in the grey palette, the same frame every upgrade icon uses. -->
  <rect x="0.5" y="0.5" width="43" height="43" fill="#c0c0c0"/>
  <rect x="0" y="0" width="44" height="1" fill="#ffffff"/>
  <rect x="0" y="0" width="1" height="44" fill="#ffffff"/>
  <rect x="0" y="1" width="44" height="1" fill="#dfdfdf"/>
  <rect x="1" y="0" width="1" height="44" fill="#dfdfdf"/>
  <rect x="0" y="43" width="44" height="1" fill="#000000"/>
  <rect x="43" y="0" width="1" height="44" fill="#000000"/>
  <rect x="0" y="42" width="44" height="1" fill="#808080"/>
  <rect x="42" y="0" width="1" height="44" fill="#808080"/>
  <!-- A taskbar tray with two buttons and a raised edge. -->
  <rect x="6.5" y="10.5" width="31" height="23" fill="#c0c0c0" stroke="#000000" stroke-width="1"/>
  <rect x="8" y="12" width="13" height="9" fill="#000080" stroke="#000000" stroke-width="0.8"/>
  <path d="M8 26h28" stroke="#808080" stroke-width="1"/>
  <path d="M8 27h28" stroke="#ffffff" stroke-width="1"/>
  <g fill="#808080" stroke="#000000" stroke-width="0.8">
    <rect x="8.5" y="24" width="6" height="5"/>
    <rect x="15.5" y="24" width="4" height="5"/>
    <rect x="23" y="13" width="12" height="8"/>
  </g>
  <g fill="#ffffff">
    <rect x="24" y="15" width="8" height="1"/>
    <rect x="24" y="18" width="5" height="1"/>
  </g>
</svg>
