<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- System Tray: the sunken tray at the end of the taskbar, holding three small windows and the corner of the clock. -->
  <!-- The frame: a raised Windows 95 button, the same one every achievement icon uses. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The taskbar. -->
  <rect x="4" y="18" width="36" height="17" fill="#c0c0c0" stroke="#000000" stroke-width="1.1"/>
  <path d="M5 34 V19 H39" fill="none" stroke="#ffffff" stroke-width="0.9"/>
  <!-- The tray: sunken, so dark on the top and left. -->
  <rect x="7.5" y="21" width="29" height="11" fill="#b4b4b4"/>
  <path d="M7.5 32 V21 H36.5" fill="none" stroke="#808080" stroke-width="1"/>
  <path d="M36.5 21 V32 H7.5" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="9.6" y="23" width="7" height="7" fill="#c0c0c0" stroke="#000000" stroke-width="0.8"/><rect x="10.5" y="23.9" width="5.2" height="1.8" fill="#000080"/><rect x="10.799999999999999" y="26.6" width="4.6" height="2.4" fill="#ffffff"/>
  <rect x="17.6" y="23" width="7" height="7" fill="#c0c0c0" stroke="#000000" stroke-width="0.8"/><rect x="18.5" y="23.9" width="5.2" height="1.8" fill="#008080"/><rect x="18.8" y="26.6" width="4.6" height="2.4" fill="#ffffff"/>
  <rect x="25.6" y="23" width="7" height="7" fill="#c0c0c0" stroke="#000000" stroke-width="0.8"/><rect x="26.5" y="23.9" width="5.2" height="1.8" fill="#800000"/><rect x="26.8" y="26.6" width="4.6" height="2.4" fill="#ffffff"/>
  <path d="M34 24 V29" stroke="#000000" stroke-width="1"/>
  <!-- A window lifting out of the tray. -->
  <rect x="13" y="7" width="15" height="11" fill="#c0c0c0" stroke="#000000" stroke-width="1"/>
  <rect x="14.4" y="8.4" width="12.2" height="2.8" fill="#000080"/>
  <rect x="14.4" y="12.2" width="12.2" height="4.6" fill="#ffffff" stroke="#808080" stroke-width="0.5"/>
  <path d="M32 16 V9 M29.4 11.6 L32 8.6 L34.6 11.6" fill="none" stroke="#000000" stroke-width="1.4"/>
</svg>
