<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Emergency Patch: a sticking plaster across a crack in the grey face, with a red cross on its pad. -->
  <!-- The frame: a raised Windows 95 button, the same one every achievement icon uses. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient><linearGradient id="tape" x1="0" y1="15" x2="0" y2="29" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f0d0a8"/><stop offset="0.5" stop-color="#d8b080"/><stop offset="1" stop-color="#a88050"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The crack it covers, stepped like the wall damage. -->
  <path d="M6 12 H11 V17 H15 M29 27 H33 V32 H38" fill="none" stroke="#000000" stroke-width="1.6"/>
  <path d="M7 13 H12 V18 H15 M30 28 H34 V33 H38" fill="none" stroke="#ffffff" stroke-width="0.7"/>
  <g transform="rotate(35 22 22)">
  <rect x="4" y="15" width="36" height="14" fill="url(#tape)" stroke="#000000" stroke-width="1.2"/>
  <path d="M5.2 28 V16.2 H39" fill="none" stroke="#fff4e0" stroke-width="0.8" opacity="0.8"/>
  <!-- Vent holes in the tape. -->
  <g fill="#8a6a48"><rect x="7" y="18" width="1.4" height="1.4"/><rect x="10" y="21.4" width="1.4" height="1.4"/><rect x="7" y="24.6" width="1.4" height="1.4"/><rect x="35.6" y="18" width="1.4" height="1.4"/><rect x="32.6" y="21.4" width="1.4" height="1.4"/><rect x="35.6" y="24.6" width="1.4" height="1.4"/></g>
  <!-- The pad and its cross. -->
  <rect x="14.6" y="15" width="14.8" height="14" fill="#f8f8f0" stroke="#000000" stroke-width="0.9"/>
  <path d="M20.2 17.4 H23.8 V20.2 H26.6 V23.8 H23.8 V26.6 H20.2 V23.8 H17.4 V20.2 H20.2 Z" fill="#d00000" stroke="#000000" stroke-width="0.8" stroke-linejoin="miter"/>
  </g>
</svg>
