<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Autoloader: a box magazine, three brass rounds showing through its window, and a reload arrow curling back to the top. -->
  <!-- The frame: a raised Windows 95 button, the same one every achievement icon uses. -->
  <defs><linearGradient id="ff" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#cecece"/><stop offset="1" stop-color="#b4b4b4"/></linearGradient><linearGradient id="mag" x1="8" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c8d0d6"/><stop offset="0.45" stop-color="#7c878e"/><stop offset="1" stop-color="#30383e"/></linearGradient><linearGradient id="brass" x1="0" y1="12" x2="0" y2="31" gradientUnits="userSpaceOnUse" spreadMethod="pad"><stop offset="0" stop-color="#f0d070"/><stop offset="1" stop-color="#a07818"/></linearGradient></defs>
  <rect x="0" y="0" width="44" height="44" fill="url(#ff)"/>
  <path d="M0 0 H44 V1 H1 V44 H0 Z" fill="#ffffff"/>
  <path d="M1 1 H43 V2 H2 V43 H1 Z" fill="#dfdfdf"/>
  <path d="M44 0 V44 H0 V43 H43 V0 Z" fill="#000000"/>
  <path d="M43 1 V43 H1 V42 H42 V1 Z" fill="#808080"/>
  <!-- The magazine body. -->
  <path d="M8 7 H26 V37 H8 Z" fill="url(#mag)" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter"/>
  <rect x="10.5" y="11" width="13" height="21" fill="#14191c" stroke="#000000" stroke-width="0.8"/>
  <path d="M9.2 36 V8.2 H25" fill="none" stroke="#e8eef2" stroke-width="0.8" opacity="0.8"/>
  <rect x="12" y="12.6" width="12" height="4.4" fill="url(#brass)" stroke="#000000" stroke-width="0.8"/><path d="M24 12.6 L27.4 14.8 L24 17 Z" fill="#b06030" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <rect x="12" y="19.2" width="12" height="4.4" fill="url(#brass)" stroke="#000000" stroke-width="0.8"/><path d="M24 19.2 L27.4 21.4 L24 23.6 Z" fill="#b06030" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <rect x="12" y="25.8" width="12" height="4.4" fill="url(#brass)" stroke="#000000" stroke-width="0.8"/><path d="M24 25.8 L27.4 28 L24 30.200000000000003 Z" fill="#b06030" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <rect x="8" y="33.6" width="18" height="3.4" fill="#30383e" stroke="#000000" stroke-width="0.8"/>
  <!-- The reload arrow. -->
  <path d="M30 30 Q37 27 36.4 18 " fill="none" stroke="#000000" stroke-width="5" stroke-linecap="butt"/>
  <path d="M30 30 Q37 27 36.4 18 " fill="none" stroke="#00a000" stroke-width="2.6" stroke-linecap="butt"/>
  <polygon points="36.4,9.6 41.4,18.4 31.4,18.4" fill="#00a000" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter"/>
</svg>
