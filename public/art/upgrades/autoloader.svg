<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <!-- Placeholder icon for the autoloader global upgrade (docs/GLOBAL-UPGRADES.md §7.2): the artist
       replaces this file. Never drawn at more than 18 px in the list. -->
