<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ring" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="0.5" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#a87800"/>
    </linearGradient>
    <radialGradient id="lamp" cx="14.6" cy="14.6" r="5.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffe870"/>
      <stop offset="1" stop-color="#d89800"/>
    </radialGradient>
    <radialGradient id="glow" cx="16" cy="16" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- A ring with a lamp in the middle. The tile shows through the gap. -->
  <circle cx="16" cy="16" r="10" fill="url(#glow)"/>
  <g stroke="#6a4c00" stroke-width="1.2">
    <line x1="16" y1="16" x2="8.2" y2="8.2"/><line x1="16" y1="16" x2="23.8" y2="8.2"/>
    <line x1="16" y1="16" x2="8.2" y2="23.8"/><line x1="16" y1="16" x2="23.8" y2="23.8"/>
  </g>
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#000000" stroke-width="4.6"/>
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <g fill="#6a4c00">
    <circle cx="16" cy="3.5" r="0.8"/><circle cx="28.5" cy="16" r="0.8"/>
    <circle cx="16" cy="28.5" r="0.8"/><circle cx="3.5" cy="16" r="0.8"/>
  </g>
  <circle cx="16" cy="16" r="4.6" fill="url(#lamp)" stroke="#000000" stroke-width="0.9"/>
</svg>
