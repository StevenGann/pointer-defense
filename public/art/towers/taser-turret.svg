<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ball" cx="15.2" cy="15.2" r="3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffff00"/>
      <stop offset="1" stop-color="#a09000"/>
    </radialGradient>
    <radialGradient id="glow" cx="16" cy="16" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffff80" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffff00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- A Tesla coil seen from above. It never turns, so it has no front. -->
  <circle cx="16" cy="16" r="8" fill="url(#glow)"/>
  <g fill="none" stroke="#000000" stroke-width="1.8">
    <circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="4"/>
  </g>
  <g fill="none" stroke="#d8b030" stroke-width="1">
    <circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="4"/>
  </g>
  <!-- Three static sparks. -->
  <g fill="none" stroke="#ffffa0" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 13.4 L15 11.6 L16.6 10.6 L15.8 8.6"/>
    <path d="M18.3 17.3 L20.2 17.2 L20.4 19 L22.4 19.6"/>
    <path d="M13.7 17.3 L12.6 18.9 L10.9 18.2 L9.6 19.8"/>
  </g>
  <circle cx="16" cy="16" r="2.6" fill="url(#ball)" stroke="#000000" stroke-width="0.8"/>
</svg>
