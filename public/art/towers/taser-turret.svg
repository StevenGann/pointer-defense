<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
  <radialGradient id="glow" cx="16" cy="16" r="9" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffff80" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#ffff00" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="torus" x1="10" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#f0c060"/>
    <stop offset="0.5" stop-color="#b07820"/>
    <stop offset="1" stop-color="#5a3a08"/>
  </linearGradient>
  </defs>
  <!-- A Tesla coil seen from above. It never turns, so it has no front: a copper secondary winding,
     a dark former, a steel top-load with a live core, and four discharge prongs on the diagonals. -->
  <circle cx="16" cy="16" r="9" fill="url(#glow)"/>
  <g stroke="#000000" stroke-width="2.2" stroke-linecap="round"><line x1="19.82" y1="12.18" x2="22.08" y2="9.92"/><line x1="19.82" y1="19.82" x2="22.08" y2="22.08"/><line x1="12.18" y1="19.82" x2="9.92" y2="22.08"/><line x1="12.18" y1="12.18" x2="9.92" y2="9.92"/></g>
  <g stroke="#9aa5ad" stroke-width="0.9" stroke-linecap="round"><line x1="19.82" y1="12.18" x2="22.08" y2="9.92"/><line x1="19.82" y1="19.82" x2="22.08" y2="22.08"/><line x1="12.18" y1="19.82" x2="9.92" y2="22.08"/><line x1="12.18" y1="12.18" x2="9.92" y2="9.92"/></g>
  <circle cx="22.22" cy="9.78" r="1" fill="#f4e480" stroke="#000000" stroke-width="0.5"/><circle cx="22.22" cy="22.22" r="1" fill="#f4e480" stroke="#000000" stroke-width="0.5"/><circle cx="9.78" cy="22.22" r="1" fill="#f4e480" stroke="#000000" stroke-width="0.5"/><circle cx="9.78" cy="9.78" r="1" fill="#f4e480" stroke="#000000" stroke-width="0.5"/>
  <!-- The winding: a copper ring, hatched so it reads as turns of wire. -->
  <circle cx="16" cy="16" r="6.2" fill="url(#torus)" stroke="#000000" stroke-width="1"/>
  <circle cx="16" cy="16" r="5" fill="none" stroke="#5a3a08" stroke-width="1.6" stroke-dasharray="0.5 0.81"/>
  <circle cx="16" cy="16" r="3.6" fill="#1a1a06" stroke="#000000" stroke-width="0.7"/>
  <!-- Top-load and its live core. -->
  <circle cx="16" cy="16" r="2.4" fill="#7c878e" stroke="#000000" stroke-width="0.7"/>
  <circle cx="16" cy="16" r="1.3" fill="#ffff00"/>
  <circle cx="15.6" cy="15.6" r="0.5" fill="#ffffff"/>
</svg>
