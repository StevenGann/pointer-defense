<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bar" x1="0" y1="10" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8c66"/>
      <stop offset="0.45" stop-color="#ff3300"/>
      <stop offset="1" stop-color="#8a1c00"/>
    </linearGradient>
  </defs>
  <!-- A long bar plinth with cooling fins on both ends. -->
  <rect x="3" y="10" width="26" height="12" fill="url(#bar)" stroke="#000000" stroke-width="1"/>
  <g stroke="#5a1200" stroke-width="1">
    <line x1="5.5" y1="11.5" x2="5.5" y2="20.5"/><line x1="7.5" y1="11.5" x2="7.5" y2="20.5"/><line x1="9.5" y1="11.5" x2="9.5" y2="20.5"/>
    <line x1="22.5" y1="11.5" x2="22.5" y2="20.5"/><line x1="24.5" y1="11.5" x2="24.5" y2="20.5"/><line x1="26.5" y1="11.5" x2="26.5" y2="20.5"/>
  </g>
  <line x1="4" y1="11.2" x2="28" y2="11.2" stroke="#ffd0c0" stroke-width="0.8" opacity="0.7"/>
  <!-- The emitter mount. -->
  <circle cx="16" cy="16" r="5" fill="#7a1800" stroke="#000000" stroke-width="0.8"/>
