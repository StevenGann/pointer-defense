<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
  <linearGradient id="plinth" x1="5" y1="5" x2="27" y2="27" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#35a3a3"/>
    <stop offset="0.5" stop-color="#008080"/>
    <stop offset="1" stop-color="#004c4c"/>
  </linearGradient>
  <linearGradient id="deck" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#007474"/>
    <stop offset="1" stop-color="#005a5a"/>
  </linearGradient>
  </defs>
  <!-- Gun: a square armoured plinth. A bevelled frame, a sunk deck plate and a ball-race for the turret. -->
  <rect x="5" y="5" width="22" height="22" fill="url(#plinth)" stroke="#000000" stroke-width="1"/>
  <path d="M6 26 V6 H26" fill="none" stroke="#8fdcdc" stroke-width="0.8" opacity="0.8"/>
  <path d="M26 6.4 V26 H6.4" fill="none" stroke="#002e2e" stroke-width="0.8" opacity="0.8"/>
  <!-- The sunk deck: dark on the top-left, where the frame shades it. -->
  <rect x="8.5" y="8.5" width="15" height="15" fill="url(#deck)"/>
  <path d="M8.5 23.5 V8.5 H23.5" fill="none" stroke="#002e2e" stroke-width="1"/>
  <path d="M23.5 8.5 V23.5 H8.5" fill="none" stroke="#6fcaca" stroke-width="1"/>
  <!-- Frame seams at the mid-points, so the frame reads as four bolted plates. -->
  <g stroke="#002e2e" stroke-width="0.7">
  <line x1="16" y1="5.6" x2="16" y2="8"/><line x1="16" y1="24" x2="16" y2="26.4"/>
  <line x1="5.6" y1="16" x2="8" y2="16"/><line x1="24" y1="16" x2="26.4" y2="16"/>
  </g>
  <!-- Corner bolts. -->
  <circle cx="7" cy="7" r="0.9" fill="#101418"/><circle cx="6.73" cy="6.73" r="0.36" fill="#ffffff" opacity="0.7"/><circle cx="25" cy="7" r="0.9" fill="#101418"/><circle cx="24.73" cy="6.73" r="0.36" fill="#ffffff" opacity="0.7"/>
  <circle cx="7" cy="25" r="0.9" fill="#101418"/><circle cx="6.73" cy="24.73" r="0.36" fill="#ffffff" opacity="0.7"/><circle cx="25" cy="25" r="0.9" fill="#101418"/><circle cx="24.73" cy="24.73" r="0.36" fill="#ffffff" opacity="0.7"/>
  <!-- The ball-race: a dark ring with index ticks. -->
  <circle cx="16" cy="16" r="6.3" fill="#003c3c" stroke="#000000" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="5" fill="none" stroke="#1d7c7c" stroke-width="1.2" stroke-dasharray="1 1.62"/>
  <path d="M11.2 14.7 A5 5 0 0 1 14.7 11.2" fill="none" stroke="#8fdcdc" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
</svg>
