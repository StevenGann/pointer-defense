<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
  <g id="arm">
    <polygon points="16,4.6 17.5,9.4 17,14 15,14 14.5,9.4" fill="#0c3c5a" stroke="#0c3c5a" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="16,4.6 16,14 15,14 14.5,9.4" fill="#ffffff"/>
    <polygon points="16,4.6 17.5,9.4 17,14 16,14" fill="#a8dcf4"/>
    <path d="M12.9 7.4 L14.8 10 M19.1 7.4 L17.2 10" fill="none" stroke="#0c3c5a" stroke-width="1.9" stroke-linecap="square"/>
    <path d="M12.9 7.4 L14.8 10 M19.1 7.4 L17.2 10" fill="none" stroke="#e8f8ff" stroke-width="0.8" stroke-linecap="square"/>
  </g>
  </defs>
  <!-- A cryo emitter: six ice spikes round a hexagonal nozzle. It never turns, so it has no front. -->
  <use href="#arm"/>
  <use href="#arm" transform="rotate(60 16 16)"/>
  <use href="#arm" transform="rotate(120 16 16)"/>
  <use href="#arm" transform="rotate(180 16 16)"/>
  <use href="#arm" transform="rotate(240 16 16)"/>
  <use href="#arm" transform="rotate(300 16 16)"/>
  <!-- The nozzle. -->
  <polygon points="17.7,13.06 19.4,16 17.7,18.94 14.3,18.94 12.6,16 14.3,13.06" fill="#2880ae" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="14.3,18.94 12.6,16 14.3,13.06 17.7,13.06" fill="none" stroke="#a8dcf4" stroke-width="0.6" opacity="0.9"/>
  <circle cx="16" cy="16" r="1.5" fill="#e8f8ff" stroke="#0c3c5a" stroke-width="0.6"/>
</svg>
