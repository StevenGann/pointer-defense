<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <g id="arm">
      <line x1="16" y1="16" x2="16" y2="5.6"/>
      <path d="M13.6 7.6 L16 10 L18.4 7.6" fill="none"/>
      <path d="M14.2 11.4 L16 13 L17.8 11.4" fill="none"/>
    </g>
    <g id="flake">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60 16 16)"/>
      <use href="#arm" transform="rotate(120 16 16)"/>
      <use href="#arm" transform="rotate(180 16 16)"/>
      <use href="#arm" transform="rotate(240 16 16)"/>
      <use href="#arm" transform="rotate(300 16 16)"/>
    </g>
  </defs>
  <!-- A six-arm snowflake. It never turns. A dark copy sits under the white one for contrast. -->
  <use href="#flake" stroke="#0c4466" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <use href="#flake" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="16,13.4 18.25,14.7 18.25,17.3 16,18.6 13.75,17.3 13.75,14.7" fill="#e8f8ff" stroke="#0c4466" stroke-width="0.7"/>
</svg>
