  <path d="M24.5 7.5 V24.5 H7.5" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Registration marks. -->
  <g fill="none" stroke="#585858" stroke-width="0.6">
  <path d="M9 11 V9 H11 M21 9 H23 V11 M23 21 V23 H21 M11 23 H9 V21"/>
  </g>
