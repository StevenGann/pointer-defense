<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
  <linearGradient id="bl" x1="11.4" y1="0" x2="13.6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aeb8bf"/>
      <stop offset="0.4" stop-color="#5d686f"/>
      <stop offset="1" stop-color="#1f262b"/>
    </linearGradient>
  <linearGradient id="br" x1="18.4" y1="0" x2="20.6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aeb8bf"/>
      <stop offset="0.4" stop-color="#5d686f"/>
      <stop offset="1" stop-color="#1f262b"/>
    </linearGradient>
  <linearGradient id="yoke" x1="9" y1="11" x2="23" y2="19" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#b9d0e2"/>
    <stop offset="0.45" stop-color="#5a7d9a"/>
    <stop offset="1" stop-color="#2c4558"/>
  </linearGradient>
  <radialGradient id="drum" cx="0.35" cy="0.35" r="0.8">
    <stop offset="0" stop-color="#8fa4b4"/>
    <stop offset="1" stop-color="#23323e"/>
  </radialGradient>
  </defs>
  <!-- Points north. Twin autocannon, set wide on a shared yoke, with conical flash hiders, recoil
     springs and an ammunition drum behind each gun. The barrels sit 3.5 either side of the pivot,
     where the twin muzzle flash is drawn. -->
  <rect x="11.4" y="4.4" width="2.2" height="8.6" fill="url(#bl)" stroke="#000000" stroke-width="0.9"/>
  <polygon points="10.6,2.4 14.4,2.4 13.7,5 11.3,5" fill="#1c2226" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <rect x="11.3" y="2.9" width="1" height="0.7" fill="#7c878e"/>
  <path d="M11.4 8.2 H13.6 M11.4 9.6 H13.6 M11.4 11 H13.6" stroke="#0c1114" stroke-width="0.6"/>
  <rect x="18.4" y="4.4" width="2.2" height="8.6" fill="url(#br)" stroke="#000000" stroke-width="0.9"/>
  <polygon points="17.6,2.4 21.4,2.4 20.7,5 18.3,5" fill="#1c2226" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <rect x="18.3" y="2.9" width="1" height="0.7" fill="#7c878e"/>
  <path d="M18.4 8.2 H20.6 M18.4 9.6 H20.6 M18.4 11 H20.6" stroke="#0c1114" stroke-width="0.6"/>
  <!-- Ammunition drums behind the breeches. -->
  <circle cx="11.6" cy="19.6" r="2.7" fill="url(#drum)" stroke="#000000" stroke-width="0.9"/>
  <circle cx="20.4" cy="19.6" r="2.7" fill="url(#drum)" stroke="#000000" stroke-width="0.9"/>
  <circle cx="11.6" cy="19.6" r="0.8" fill="#0c1114"/><circle cx="20.4" cy="19.6" r="0.8" fill="#0c1114"/>
  <!-- The yoke: a wide cradle with trunnion caps at both ends. -->
  <polygon points="10.2,12 21.8,12 23,13.2 23,17.6 21.8,18.8 10.2,18.8 9,17.6 9,13.2" fill="url(#yoke)" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M9.9 17.4 V13.5 L10.6 12.9 H21" fill="none" stroke="#e2eef8" stroke-width="0.7" opacity="0.8"/>
  <line x1="12.5" y1="12.6" x2="12.5" y2="18.2" stroke="#23323e" stroke-width="0.6"/>
  <line x1="19.5" y1="12.6" x2="19.5" y2="18.2" stroke="#23323e" stroke-width="0.6"/>
  <!-- Ring sight on the pivot: the gunner's speed ring, seen from above. -->
  <circle cx="16" cy="16" r="2.6" fill="#23323e" stroke="#000000" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="1.5" fill="none" stroke="#b9d0e2" stroke-width="0.6"/>
  <path d="M16 14 V18 M14 16 H18" stroke="#b9d0e2" stroke-width="0.5"/>
</svg>
