  <circle cx="16" cy="16" r="6" fill="#3c5a70" stroke="#000000" stroke-width="0.8"/>
  <path d="M11.4 14.8 A4.8 4.8 0 0 1 14.8 11.4" fill="none" stroke="#bcd2e6" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
