<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="plinth" x1="5" y1="5" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9dbcd9"/>
