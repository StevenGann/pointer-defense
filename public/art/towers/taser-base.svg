<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A diamond plinth cut into four facets, with a dark insulator deck. -->
  <polygon points="3,16 16,3 16,16" fill="#b4b43c"/>
  <polygon points="16,3 29,16 16,16" fill="#8e8e12"/>
  <polygon points="3,16 16,29 16,16" fill="#6c6c00"/>
  <polygon points="16,29 29,16 16,16" fill="#4c4c00"/>
  <polygon points="16,3 29,16 16,29 3,16" fill="none" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="16,7.5 24.5,16 16,24.5 7.5,16" fill="#3a3a08" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M8.9 16 L16 8.9" fill="none" stroke="#b4b43c" stroke-width="0.8" opacity="0.7"/>
  <!-- Four terminals. -->
  <g fill="#e6e6a0" stroke="#000000" stroke-width="0.5">
    <circle cx="16" cy="5.4" r="1"/><circle cx="26.6" cy="16" r="1"/>
    <circle cx="16" cy="26.6" r="1"/><circle cx="5.4" cy="16" r="1"/>
  </g>
</svg>
