  <circle cx="16" cy="26.4" r="1.5" fill="#e8e4c8" stroke="#000000" stroke-width="0.6"/><circle cx="16" cy="26.4" r="0.6" fill="#5a5a10"/><circle cx="5.6" cy="16" r="1.5" fill="#e8e4c8" stroke="#000000" stroke-width="0.6"/><circle cx="5.6" cy="16" r="0.6" fill="#5a5a10"/>
