  <path d="M4.6 16 L16 4.6" fill="none" stroke="#e0e090" stroke-width="0.7" opacity="0.8"/>
  <path d="M27.4 16 L16 27.4" fill="none" stroke="#202000" stroke-width="0.7" opacity="0.8"/>
