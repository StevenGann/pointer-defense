<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
  <linearGradient id="rail" x1="13.4" y1="0" x2="18.6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aeb8bf"/>
      <stop offset="0.4" stop-color="#5d686f"/>
      <stop offset="1" stop-color="#1f262b"/>
    </linearGradient>
  <linearGradient id="hub" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffb499"/>
    <stop offset="0.45" stop-color="#e02c00"/>
    <stop offset="1" stop-color="#701600"/>
  </linearGradient>
  <linearGradient id="crystal" x1="14" y1="2" x2="18" y2="7" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#ff8060"/>
  </linearGradient>
  </defs>
  <!-- Points north. Two steel rails hold a hot beam channel between them; three focusing collars
     step down toward a cut crystal at the tip. A hexagonal lamp house sits on the pivot, with a
     capacitor block behind it. -->
  <!-- Capacitor block. -->
  <rect x="13.2" y="19.4" width="5.6" height="3.4" fill="#2a2f33" stroke="#000000" stroke-width="0.9"/>
  <path d="M14.6 20.2 V22 M16 20.2 V22 M17.4 20.2 V22" stroke="#ff6a40" stroke-width="0.6"/>
  <!-- Rails and beam channel. -->
  <rect x="14" y="6" width="4" height="9" fill="url(#rail)" stroke="#000000" stroke-width="0.9"/>
  <rect x="15.4" y="6.4" width="1.2" height="8.4" fill="#fff0b0"/>
  <rect x="15.75" y="6.4" width="0.5" height="8.4" fill="#ffffff"/>
  <!-- Focusing collars, widest at the breech. -->
  <g fill="#1c2226" stroke="#000000" stroke-width="0.6">
  <rect x="12.9" y="11.6" width="6.2" height="1.5"/>
  <rect x="13.3" y="9.2" width="5.4" height="1.3"/>
  <rect x="13.6" y="7" width="4.8" height="1.1"/>
  </g>
  <!-- The crystal: two facets, lit on the left. -->
  <polygon points="16,2.2 18.4,5 16,7.6 13.6,5" fill="url(#crystal)" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M16 2.6 V7.2 M13.9 5 H18.1" stroke="#c03000" stroke-width="0.4" opacity="0.7"/>
  <!-- Lamp house. -->
  <polygon points="18.3,12.02 20.6,16 18.3,19.98 13.7,19.98 11.4,16 13.7,12.02" fill="url(#hub)" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <path d="M12.7 16.6 V14.6 L15.6 12.9" fill="none" stroke="#ffe0d0" stroke-width="0.6" opacity="0.8"/>
  <circle cx="16" cy="16" r="2.1" fill="#3c0c00" stroke="#000000" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="1.2" fill="#fff0b0"/>
  <circle cx="15.6" cy="15.6" r="0.45" fill="#ffffff"/>
</svg>
